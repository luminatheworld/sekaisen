      let heads = []; try { heads = [...PRESS.both(early ? 'retireEarly_' + p.flags.early.reason : sum.peakOvr >= 85 || sum.bdo || sum.trophies >= 6 ? 'retireLegend' : 'retire', p, { age: p.age - 1 }), ...rn.map(r => PRESS.make('retnum', p, { club: club(r.club).name, n: r.num })), ...hof.slice(0, 1).map(h => PRESS.make('hof', p, { club: club(h.club).name }))].filter(Boolean); PRESS.record(p, heads); Store.save('career', p); } catch (e) { heads = []; }
      S.retire = { done: true, summary: sum, career: p, retiredNums: rn, hof, heads }; S.p = null; S.lastRes = null; S.phase = 'prep';
      render(); window.scrollTo(0, 0); return;
    }
    if (a === 'viewrec') { const id = el.dataset.id; const sum = S.world.careers.find(c => c.id === id); const career = (S.retire?.career?.id === id ? S.retire.career : null) || await Store.loadCareer(id); S.viewCareer = { summary: sum, career }; S.cardMode = 'rec'; S.rtab = 'season'; S.view = 'card'; render(); window.scrollTo(0, 0); return; }
    if (a === 'cardback') { S.cardMode = 'card'; render(); return; }
    if (a === 'sample') return runSample(el.dataset.id);
    if (a === 'export') return exportSave();
    if (a === 'rename') { const v = $('#worldname').value.trim(); if (v) { S.world.name = v.slice(0, 40); Store.save('world', S.world); toast('세계선 이름을 바꿨어요.'); render(); } return; }
    if (a === 'doimport') { const d = S._import; if (!d) return; S.world = Object.assign(blankWorld(), d.world); for (const c of d.careers) { migrateCareer(c); Store.save('career', c); } Store.save('world', S.world); S.p = S.world.activeId ? d.careers.find(c => c.id === S.world.activeId) || null : null; await worldReady(); if (S.migMsg) { setTimeout(() => toast(S.migMsg), 3600); S.migMsg = ''; } if (S.p) S.choice = defaultChoice(S.p); if (d.crests && typeof d.crests === 'object') { S.crests = Object.assign({}, S.crests, d.crests); saveCrests(); } S._import = null; toast('세이브를 불러왔어요.'); S.view = 'world'; render(); return; }
    if (a === 'crestclear') { if (!S._clearArm) { S._clearArm = true; S.crestMsg = '한 번 더 누르면 직접 넣은 엠블럼을 모두 지워요.'; render(); setTimeout(() => { S._clearArm = false; }, 4000); return; } S._clearArm = false; S.crests = {}; saveCrests(); S.crestMsg = '모두 지웠어요.'; render(); return; }
    if (a === 'cancelimport') { S._import = null; $('#importconfirm').hidden = true; return; }
    if (a === 'importcrests') { const d = S._import; if (!d?.crests) return; const n = Object.keys(d.crests).length; S.crests = Object.assign({}, S.crests, d.crests); saveCrests(); S._import = null; toast(`엠블럼 ${n}개를 가져왔어요. 세계선은 그대로예요.`); render(); return; }
  }

  async function exportSave() {
    const careers = []; for (const c of S.world.careers) { const k = await Store.loadCareer(c.id); if (k) careers.push(k); } if (S.p) careers.push(S.p);
    const data = JSON.stringify({ app: 'sekaisen-career', v: 3, world: S.world, careers, crests: S.crests });
    const filename = `세계선-${S.world.name}-${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
    if (dl) { try { await dl.save({ filename, data }); toast('세이브 파일을 저장했어요.'); } catch (e) { if (e?.code !== 'declined') toast('파일을 저장하지 못했어요.'); } return; }
    try { const url = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = `sekaisen-career-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('세이브 파일을 내려받았어요.'); } catch { toast('파일을 저장하지 못했어요.'); }
  }
  function importFile(file) {
    if (!file) return; const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (d.app !== 'sekaisen-career' || !d.world) throw 0; S._import = d; const b = $('#importconfirm'); b.hidden = false; const nc = d.crests && typeof d.crests === 'object' ? Object.keys(d.crests).length : 0; b.innerHTML = `<p>‘${esc(d.world.name)}’(커리어 ${d.world.careers.length}개)로 지금 세계선을 덮어써요. 되돌릴 수 없어요.${nc ? ` 직접 넣은 엠블럼 ${nc}개도 같이 들어 있어요. 엠블럼만 가져오면 지금 세계선은 그대로 둬요.` : ''}</p><div class="row wrapgap"><button class="btn" data-act="cancelimport">취소</button>${nc ? `<button class="btn" data-act="importcrests">엠블럼만 가져오기</button>` : ''}<button class="btn primary" data-act="doimport">덮어쓰기</button></div>`; $$('[data-act]', b).forEach(x => x.onclick = () => act(x.dataset.act, x)); } catch { toast('세계선 커리어 세이브 파일이 아니에요.'); } };
    fr.readAsText(file);
  }
  async function runSample(id) {
    const out = $('#sampleout'); const btn = $('#samplebtn');
    const sum = S.world.careers.find(c => c.id === id); if (!sum || !_sample) return;
    const career = (S.retire?.career?.id === id ? S.retire.career : null) || (S.viewCareer?.career) || await Store.loadCareer(id);
    const finals = (career?.finals || []).slice(0, 12).map(f => `${f.year} ${f.comp} ${f.won ? '우승' : '준우승'} vs ${f.oppNation ? f.opp : club(f.opp).name} ${f.a}-${f.b}${f.pens ? ' 승부차기' : ''} (${f.played ? f.g + '골 ' + f.as + '도움' : '결장'}${f.pkMiss ? ', PK 실축' : ''})`).join('\n');
    const story = (career?.seasons || []).map(s => [...s.events, ...(s.notes || [])].length || s.memo ? `${s.year} ${club(s.club).name}: ${[...s.events, ...(s.notes || [])].join(', ')}${s.memo ? ' / 메모: ' + s.memo : ''}` : '').filter(Boolean).slice(0, 40).join('\n');
    const prompt = `가상의 축구 선수 커리어가 끝났다. 한국 축구 커뮤니티(에펨코리아 해외축구 게시판) 스타일로 은퇴 소식 게시글 하나와 댓글 8개를 써줘. 반말 커뮤 말투, 기록과 사건 기반 드립, 이모지 남발 금지, 실존 인물은 등장시키지 마.\n\n이름: ${sum.name}${sum.nickname ? ` (별명 ${nickT(sum)})` : ''}\n국적: ${sum.nation} / 포지션: ${sum.pos} / 성격: ${E.TRAITS[sum.trait]?.name || ''} / ${sum.startYear}–${sum.endYear}, ${sum.retireAge}세 은퇴\n피크 OVR ${sum.peakOvr}, 발롱도르 ${sum.bdo}회\n${sum.temper ? `숨은 기질: ${sum.temper.big}${sum.temper.nat ? ', ' + sum.temper.nat : ''} (${[...(sum.temper.bigLines || []), ...(sum.temper.natLines || [])].join(' / ')})\n` : ''}${sum.apps}경기 ${sum.goals}골 ${sum.assists}도움${sum.pos === 'GK' ? `, 클린시트 ${sum.cs}` : ''}, 평균 평점 ${sum.avgRating}\n우승 ${sum.trophies}회, 개인상 ${sum.awards}회 (${Object.entries(sum.awardCount || {}).map(([k, v]) => k + ' ' + v).join(', ')})\n주요 구단: ${sum.topClubs.slice(0, 5).map(t => club(t.club).name + ' ' + t.n + '시즌').join(', ')}\n부상 ${sum.injuries}회 (장기 ${sum.majorInj})\n결승:\n${finals || '없음'}\n시즌별 사건:\n${story || '없음'}\n은퇴 후: ${sum.post === 'coach' ? '감독 데뷔 예정' : sum.post === 'legend' ? '구단 앰배서더' : '축구계 은퇴'}`;
    btn.disabled = true; out.hidden = false; out.textContent = '쓰는 중…';
    try { await _sample(prompt, { onText: ({ text }) => { out.textContent = text; } }); }
    catch (e) { if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') { out.textContent = ''; out.hidden = true; btn.hidden = true; } else { out.textContent = (e?.text || '') + (e?.code === 'rate_limited' ? '\n\n잠시 뒤에 다시 눌러 주세요.' : '\n\n만들지 못했어요. 다시 눌러 주세요.'); } }
    finally { btn.disabled = false; }
  }

  // ---------- migration & boot ----------
  // v4: 능력치 통합 + 주발·약발 (옛 세이브는 선수 id로 고정된 값을 받는다)
  function migrateV4(q) {
    if (!q || q.v4) return q;
    E.mergeAttrs(q.attrs);
    if (q.foot !== 'L' && q.foot !== 'R') q.foot = E.seeded('foot|' + q.id)() < .24 ? 'L' : 'R';
    if (!q.weak) q.weak = E.rollWeak(E.seeded('weak|' + q.id));
    if (q.lastFocus && !['pos', 'role', 'bal', 'weak', ...Object.keys(E.groupsFor(q.pos))].includes(q.lastFocus) && !E.attrsFor(q.pos).includes(q.lastFocus)) q.lastFocus = 'pos';
    q.v4 = true; return q;
  }
  function migrateCareer(p) { const q = migrateV4(migrateCareer0(p)); if (q && !q.roleXp) { q.roleXp = {}; (q.seasons || []).forEach(x => { if (x.role) q.roleXp[x.role] = Math.min(100, (q.roleXp[x.role] || 0) + 22); }); if (q.role && q.roleXp[q.role] == null) q.roleXp[q.role] = 30; } return q; }
  function migrateCareer0(p) {
    if (!p) return p;
    if (p.v === 2) { (p.seasons || []).forEach(x => x.bdoDone = true); p.v = 3; return p; }
    if (p.v === 3) return p;
    const posMap = { CAM: 'AM', CDM: 'DM' }; p.pos = posMap[p.pos] || p.pos; p.origPos = p.origPos || p.pos;
    const roleMap = { treq: 'treq', ap: 'ap', shadow: 'shadow', enganche: 'ap', b2b: 'b2b', dlp: 'dlp', mezzala: 'mezzala', bwm: 'carrilero', anchor: 'anchor', regista: 'regista', halfback: 'halfback', inside: 'insidef', winger: 'winger', wideplay: 'invwinger', overlap: 'overlapfb', invfb: 'invfb', deffb: 'holdfb', wingback: 'overlapfb', bpd: 'bpd', stopper: 'stopper', cover: 'covercb', libero: 'libero', sweeper: 'sweeperk', shot: 'shotstop', distrib: 'buildgk', target: 'target', poacher: 'poacher', complete: 'complete', false9: 'false9' };
    p.role = roleMap[p.role] || E.rolesFor(p.pos)[0].id; if (!E.rolesFor(p.pos).find(r => r.id === p.role)) p.role = E.rolesFor(p.pos)[0].id;
    const old = p.attrs || {}; const na = {}; const o = (k) => old[k] ?? 55;
    if (p.pos === 'GK') Object.assign(na, { REF: o('REF'), DIV: o('DIV'), ONE: (o('REF') + o('POS')) / 2, HAN: o('HAN'), GPO: o('POS'), COM: (o('HAN') + o('POS')) / 2, KIC: o('KIC'), SWP: o('SWP') });
    else Object.assign(na, { TEC: (o('DRI') + o('PAS')) / 2, DRI: o('DRI'), PAS: o('PAS'), CRO: (o('PAS') + o('PAC')) / 2, SHO: o('SHO'), VIS: o('PAS'), MOV: (o('SHO') + o('PAC')) / 2, DEF: o('DEF'), TKL: o('DEF'), PRS: (o('DEF') + o('PHY')) / 2, AIR: o('PHY'), PAC: o('PAC'), STA: o('PHY'), STR: o('PHY') });
    p.attrs = na; p.v = 3; (p.seasons || []).forEach(x => x.bdoDone = true);
    Object.assign(p, { morale: p.morale ?? 62, trust: p.trust ?? 50, fans: p.fans || { [p.club]: 45 }, rep: p.rep ?? 10, dur: p.dur ?? 70, contract: p.contract ?? 2, flags: p.flags || {}, kids: p.kids || [], tags: p.tags || [], clubMods: p.clubMods || [], mgrOverride: p.mgrOverride || {}, numbers: p.numbers || [], injuries: p.injuries || [], trait: p.trait || 'pro', look: p.look || AVATAR.randomLook(Math.random, p.nation), prefNumber: p.prefNumber || 10 });
    return p;
  }
  async function boot() {
    S.world = Object.assign(blankWorld(), LS.get('sk_world') || {});
    if (S.world.activeId) S.p = migrateCareer(LS.get('sk_career_' + S.world.activeId));
    S.world.careers.forEach(c => { c.pos = { CAM: 'AM', CDM: 'DM' }[c.pos] || c.pos; c.kids = c.kids || []; });
    await worldReady(); if (S.p) afterLoad();
    S.ready = true; S.view = S.p ? 'career' : 'world'; render();
    if (S.migMsg) { toast(S.migMsg); S.migMsg = ''; }
    await Store.init();
    if (Store.cloud) {
      const w = await Store.loadWorld();
      if (w && (w.updatedAt || 0) > (S.world.updatedAt || 0)) {
        S.world = Object.assign(blankWorld(), w); S.p = w.activeId ? migrateCareer(await Store.loadCareer(w.activeId)) : null;
        await worldReady(); if (S.p) afterLoad();
        if (S.view !== 'rules') S.view = S.p ? 'career' : 'world'; render();
        if (S.migMsg) { toast(S.migMsg); S.migMsg = ''; }
      } else if (S.world.updatedAt) { Store.save('world', S.world); if (S.p) Store.save('career', S.p); }
    }
  }
  // 세계선 준비: 기록 요약이 없는 커리어는 저장된 기록에서 만들고, 겹쳐 있던 커리어는 은퇴 순서대로 넣으며 처음 어긋나는 해에서 세계선을 가른다
  async function worldReady() {
    const w = S.world; let changed = false;
    w.lines = w.lines && Object.keys(w.lines).length ? w.lines : { L0: { id: 'L0', name: '원래 세계선', parent: null, split: null, created: 0 } };
    for (const c of w.careers) {
      if (c.hist) continue; let doc = null; try { doc = await Store.loadCareer(c.id); } catch { doc = null; }
      c.hist = doc ? E.histOf(doc) : { s: [], lg: [], cont: [], nat: [], nt: [], aw: [] };
      if (doc && !c.stints) { try { c.stints = E.summarize(doc).stints; } catch { } }
      changed = true;
    }
    for (const c of w.careers) {
      if (c.v10) continue; let doc = null; try { doc = await Store.loadCareer(c.id); } catch { doc = null; }
      if (doc) { try { const n = E.summarize(doc); for (const k of ['apps', 'goals', 'assists', 'saves', 'cs', 'trophies', 'youthTrophies']) c[k] = n[k]; } catch { } }
      c.v10 = 1; changed = true;
    }
    const needs = w.careers.some(c => !c.line || !w.lines[c.line]) || (S.p && !(S.p.line && w.lines[S.p.line]));
    if (needs) { let out = []; try { out = E.migrateLines(w, S.p); } catch (e) { console.warn('lines', e); } changed = true; if (out.length) S.migMsg = `겹쳐 있던 커리어를 세계선 ${out.length}갈래로 정리했어요. 세계선 → 세계선 계보에서 볼 수 있어요.`; }
    if (changed) { Store.save('world', w); if (S.p) Store.save('career', S.p); }
    S.viewLine = w.lines[S.viewLine] ? S.viewLine : (S.p?.line || w.careers[w.careers.length - 1]?.line || 'L0');
    E.useLine(w, S.p?.line || S.viewLine);
  }
  function afterLoad() {
    const p = S.p; S.choice = defaultChoice(p); S.phase = 'prep'; S.windowQ = [];
    if (p.stage === 'post') { const l = p.seasons[p.seasons.length - 1]; if (l?.pendingFinal) { E.autoClubFinal(p, l, S.world); try { PRESS.flushInto(p, l); } catch { } } E.ballonLate(p, S.world); E.endOfSeason(p, S.world); p.stage = 'prep'; S.choice = defaultChoice(p); S.windowQ = EVENTS.draw('window', ctxFor(p), 0); }
    autoNumber();
  }
  boot();
})();
</script>
