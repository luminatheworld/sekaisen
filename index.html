<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="축구 선수 커리어 시뮬레이터. 대표팀 대회, 가문 계승, 영구결번까지 이어지는 세계선.">
<meta name="theme-color" content="#f1f3f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세계선">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>세계선 커리어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* Layout: 낮 경기장. 밝은 회백색 바탕에 사선 결, 흰 카드, 금색 잉크 배지. 커리어 카드만 남색 트레이딩 카드로 남긴다. */
:root {
  color-scheme: light;
  --bg: #f1f3f7; --bg-line: rgba(20, 32, 64, .022);
  --panel: #ffffff; --panel-2: #eef1f6; --panel-3: #e1e6ef;
  --line: rgba(16, 26, 52, .1); --soft: rgba(16, 26, 52, .055);
  --ink: #151b2c; --muted: #5a6378; --faint: #9aa2b4;
  --gold: #9a6a08; --gold-hi: #b5800f; --gold-ink: #ffffff; --gold-bg: rgba(201, 150, 40, .15);
  --red: #c93a30; --red-bg: rgba(201, 58, 48, .1); --pos: #12875a; --pos-bg: rgba(18, 135, 90, .1); --blue: #2a63c9;
  --ava: #f4f6fa; --ava-line: #c9a24a;
  --shadow: 0 1px 2px rgba(16, 26, 52, .06), 0 0 0 1px rgba(16, 26, 52, .06);
  --paper: #f2ede0; --paper-ink: #1d1a14; --paper-muted: #6b6455; --paper-line: #d3c8ad;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-serif: "Noto Serif KR", "AppleMyungjo", Georgia, serif;
  --r: 18px; --r-sm: 12px;
  /* 예전 이름 호환 */
  --marker: var(--gold); --accent: var(--gold); --accent-ink: var(--gold-ink); --red-bg2: var(--red-bg);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); background-image: repeating-linear-gradient(135deg, transparent 0 26px, var(--bg-line) 26px 52px); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; min-height: 100vh; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--red); }
.grow { flex: 1 1 auto; min-width: 0; }
code { font-size: .92em; background: var(--soft); padding: 0 5px; border-radius: 5px; }

/* frame */
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { padding-block: 16px 72px; display: flex; flex-direction: column; gap: 12px; }
.main.narrow { max-width: 680px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(241, 243, 247, .9); box-shadow: 0 1px 0 var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; font-weight: 900; font-size: 17px; letter-spacing: -.01em; }
.logo { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); position: relative; flex: none; }
.logo::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--ink); transform: translateX(-50%); }
.logo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); transform: translate(-50%, -50%); }
.nav { display: flex; gap: 2px; }
.nav button { background: none; border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 14px; color: var(--muted); min-height: 36px; }
.nav button.on { color: var(--ink); background: var(--panel-2); }

/* surfaces */
.panel { background: var(--panel); box-shadow: var(--shadow); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.quiet { background: transparent; box-shadow: none; padding-inline: 2px; }
.ptitle { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ptitle h2 { margin-right: auto; }
h2 { font-size: 15px; font-weight: 900; letter-spacing: -.01em; }
.h1 { font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.h3 { font-size: 14px; font-weight: 700; margin: 4px 0 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.note { background: var(--panel-2); border-radius: var(--r-sm); padding: 11px 14px; font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; } .wrapgap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2.tight { gap: 10px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; border: 0; background: var(--panel-2); border-radius: var(--r-sm); padding: 10px 16px; font-weight: 700; min-height: 44px; transition: background .15s; }
.btn:hover { background: var(--panel-3); }
.btn.primary { background: var(--gold); color: var(--gold-ink); font-weight: 900; }
.btn.primary:hover { background: var(--gold-hi); }
.btn.big { padding: 13px 22px; font-size: 16px; min-height: 52px; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.inp { width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: var(--r-sm); padding: 10px 12px; font: inherit; min-height: 44px; }
textarea.inp { resize: vertical; }
.fld { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.fld > span, .fld > legend { font-size: 13px; font-weight: 700; color: var(--muted); }
.seg, .subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .subtabs button { border: 0; background: var(--panel-2); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13.5px; color: var(--muted); min-height: 36px; }
.seg button.on, .subtabs button.on { background: var(--ink); color: var(--bg); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.chip { text-align: left; border: 0; background: var(--panel-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.chip.on { background: var(--gold-bg); box-shadow: inset 0 0 0 1.5px var(--gold); }
.chip .small { color: var(--muted); line-height: 1.4; }
.chip.sm { padding: 6px 10px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; line-height: 1.6; }
.pill.gold { background: var(--gold-bg); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(154, 106, 8, .4); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line); justify-self: start; }
.fit { font-weight: 700; } .fit.good { color: var(--pos); } .fit.bad { color: var(--red); } .fit.mid { color: var(--muted); }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 700; min-height: 36px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; font-size: 20px; line-height: 1; }
details.fold[open] > summary::after { content: "−"; }
details.fold.panel { gap: 0; padding-block: 12px; }
details.fold.panel > summary { font-size: 14px; }
details.fold .foldin { padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.sumlbl { color: var(--muted); font-weight: 700; flex: none; }

/* images */
.crest { display: inline-block; flex: none; width: 22px; height: 24px; vertical-align: middle; object-fit: contain; }
.crest.xs { width: 16px; height: 18px; vertical-align: -3px; }
.crest.sm { width: 30px; height: 33px; } .crest.md { width: 38px; height: 42px; } .crest.lg { width: 52px; height: 57px; } .crest.xl { width: 80px; height: 88px; }
.flag { display: inline-block; width: 18px; height: 12px; vertical-align: -1px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(16, 26, 52, .14); }
.flag.md { width: 27px; height: 18px; align-self: center; } .flag.lg { width: 36px; height: 24px; border-radius: 3px; }
.px { display: block; flex: none; background: var(--ava); border: 2px solid var(--ava-line); border-radius: 16px; object-fit: contain; padding: 4px 6px 2px; image-rendering: auto; }
.px.sm { width: 56px; height: 70px; border-radius: 12px; padding: 3px 4px 1px; } .px.md { width: 78px; height: 98px; } .px.lg { width: 128px; height: 160px; border-radius: 20px; padding: 8px 10px 4px; }

/* world */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 18px 2px 4px; }
.hero h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 900; letter-spacing: -.02em; line-height: 1.25; margin: 2px 0 6px; }
.hero > div:first-child { max-width: 60ch; min-width: 0; }
.herobtn { display: flex; gap: 8px; flex-wrap: wrap; }
.flow { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.flow b { color: var(--ink); margin-right: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lcard { text-align: left; border: 0; background: var(--panel-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: background .15s; }
.lcard:hover { background: var(--panel-3); }
.lc-row { display: flex; gap: 12px; align-items: center; } .lc-main { min-width: 0; }
.lc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lc-ovr { font-size: 26px; font-weight: 900; line-height: 1; color: var(--gold); }
.lc-pos { font-weight: 900; margin-right: auto; color: var(--muted); }
.lc-name { font-weight: 900; font-size: 16px; }
.lc-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.lc-stats b { color: var(--ink); margin-right: 2px; font-variant-numeric: tabular-nums; }
.lc-clubs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.lc-clubs .small { color: var(--muted); margin-right: 6px; }
.fam h3 { font-size: 15px; margin-bottom: 6px; } .fam + .fam { margin-top: 12px; }
.tree { margin: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; border-left: 2px solid var(--line); padding-left: 12px; }
.gen { font-size: 12px; font-weight: 900; color: var(--gold); }
.yearlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.yearlist .num { color: var(--gold); font-weight: 900; margin-right: 8px; }
.recs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.rec { background: var(--panel-2); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.rec b { font-size: 24px; font-weight: 900; color: var(--gold); }
.confirm { background: var(--red-bg); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.retlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.retlist li { display: flex; align-items: center; gap: 12px; }
.retnum { font-weight: 900; font-size: 22px; color: var(--gold); min-width: 2ch; text-align: center; }

/* career header */
.phead { display: flex; align-items: center; gap: 14px; background: var(--panel); box-shadow: var(--shadow); border-radius: var(--r); padding: 14px 16px; }
.phead.slim { background: transparent; box-shadow: none; padding-inline: 2px; }
.ph-left { display: flex; gap: 14px; align-items: center; min-width: 0; flex: 1; }
.ph-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pname { font-size: clamp(21px, 5vw, 28px); font-weight: 900; letter-spacing: -.02em; line-height: 1.2; }
.pnum { font-size: .6em; font-weight: 900; color: var(--gold); vertical-align: 3px; margin-left: 2px; }
.ph-sub { font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ph-ovr { display: flex; flex-direction: column; align-items: center; flex: none; }
.ph-ovr .big { font-size: 44px; font-weight: 900; line-height: 1; color: var(--gold); letter-spacing: -.03em; }
.delta { font-size: 12px; font-weight: 900; } .delta.up { color: var(--pos); } .delta.down { color: var(--red); }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; padding: 2px 4px; align-items: center; }
.meter { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.mbar { height: 5px; background: var(--panel-3); border-radius: 3px; overflow: hidden; } .mbar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.meter.low .mbar i { background: var(--red); }

/* season plan */
.prow { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: baseline; font-size: 15px; }
.plbl { color: var(--muted); font-size: 13px; font-weight: 700; }
.flbl { font-size: 13px; font-weight: 700; color: var(--muted); margin: 4px 0 -4px; }
.plan details.fold { border-top: 1px solid var(--line); padding-top: 4px; }
.plan details.fold > summary { font-size: 14px; color: var(--muted); }
.grade { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 6px; font-size: 12px; font-weight: 900; background: var(--panel-3); color: var(--muted); vertical-align: 1px; }
.grade.gS { background: var(--gold); color: var(--gold-ink); } .grade.gA { background: var(--gold-bg); color: var(--gold); } .grade.gC, .grade.gD { background: var(--red-bg); color: var(--red); }
.famtag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--panel-3); color: var(--muted); }
.famtag.f2 { background: var(--gold-bg); color: var(--gold); } .famtag.f0 { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.roles, .offers { display: flex; flex-direction: column; gap: 6px; }
.rolec, .offer { border-radius: 14px; background: var(--panel-2); cursor: pointer; }
.rolec { padding: 10px 12px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; }
.rolec input, .offer input { accent-color: var(--gold); }
.rolec input { grid-row: span 2; margin-top: 5px; }
.rolec.on, .offer.on { background: var(--gold-bg); box-shadow: inset 0 0 0 1.5px var(--gold); }
.rolec .rt, .rt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rolec .rd, .rd { color: var(--muted); grid-column: 2; line-height: 1.5; }
.rolec.noin { grid-template-columns: 1fr auto; } .rolec.noin .rd, .rolec.noin .rt { grid-column: 1 / -1; }
.rolec:has(.reqb) { grid-template-columns: 1fr auto; } .rolec:has(.reqb) .rt, .rolec:has(.reqb) .rd { grid-column: 1; } .rolec:has(.reqb) .reqb { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.offer { display: flex; gap: 12px; align-items: center; padding: 10px 12px; }
.offer.dis { opacity: .5; }
.of-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.of-t { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.numsum { flex-direction: row; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.numsum > span:first-child { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700; }
.numbig { font-size: 24px; font-weight: 900; color: var(--gold); }
.numsum .btn { margin-left: auto; }
.numgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
.numc { font-size: 13px; font-weight: 700; height: 36px; border: 0; background: var(--panel-2); border-radius: 8px; padding: 0; font-variant-numeric: tabular-nums; }
.numc:disabled { opacity: .25; cursor: not-allowed; text-decoration: line-through; }
.numc.ret:disabled { opacity: .85; text-decoration: none; background: var(--gold-bg); color: var(--gold); }
.numc.pref { box-shadow: inset 0 -3px 0 var(--gold); }
.numc.on { background: var(--gold); color: var(--gold-ink); }
.attrs { display: flex; flex-direction: column; gap: 7px; }
.attr { display: grid; grid-template-columns: 96px 1fr 30px; align-items: center; gap: 10px; font-size: 14px; }
.bar { height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: #7d8db5; border-radius: 4px; }
.attr .num { text-align: right; font-weight: 700; }
.attr.key .an { font-weight: 900; } .attr.key .bar i { background: var(--gold); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.kv .small { flex-basis: 100%; }
.stars { display: inline-flex; gap: 2px; }
.st { width: 15px; height: 15px; display: inline-block; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: var(--panel-3); }
.st.on { background: var(--gold); } .st.half { background: linear-gradient(90deg, var(--gold) 50%, var(--panel-3) 50%); }
.go { background: transparent; padding-inline: 2px; }
.simbar { display: none; }
@media (max-width: 879px) {
  .simbar { display: block; position: sticky; bottom: 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(241, 243, 247, .92); box-shadow: 0 -1px 0 var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 4; }
  .simbar .btn { width: 100%; }
  .go [data-act=start] { display: none; } .go.only-start { display: none; }
}

/* events */
.event { gap: 12px; }
.event > .eyebrow { display: flex; align-items: center; gap: 7px; }
.event > .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.event.tone-bad > .eyebrow::before { background: var(--red); } .event.tone-good > .eyebrow::before { background: var(--pos); } .event.tone-life > .eyebrow::before { background: var(--blue); } .event.tone-legacy > .eyebrow::before { background: var(--gold); }
.event .evt { font-size: 21px; font-weight: 900; letter-spacing: -.02em; line-height: 1.35; }
.event > p { color: #39415a; }
.evopts { display: flex; flex-direction: column; gap: 8px; }
.evopt { text-align: left; border: 0; background: var(--panel-2); border-radius: 14px; padding: 13px 16px; display: flex; flex-direction: column; gap: 2px; min-height: 52px; transition: background .15s; }
.evopt b { font-weight: 700; }
.evcustom { display: flex; gap: 8px; order: 99; } .evcustom .inp { flex: 1; min-width: 0; }
.evopt:hover { background: var(--panel-3); } .evopt .small { color: var(--muted); }
.outcome { background: var(--gold-bg); border-radius: 14px; padding: 12px 16px; font-size: 14.5px; }
.outcome .lines li { font-size: 14px; } .outcome p + p { margin-top: 4px; }
.grp { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.ntag { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 13.5px; font-weight: 700; }
.vs { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; font-size: 16px; font-weight: 900; }

/* results */
.result .ptitle .muted { display: inline-flex; align-items: center; gap: 4px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); gap: 6px; }
.sgrid > div { background: var(--panel-2); border-radius: var(--r-sm); padding: 9px 4px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.sgrid b { font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; } .sgrid b small { font-size: 12px; color: var(--muted); margin-left: 2px; }
.sgrid span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.lines li { padding-left: 14px; position: relative; font-size: 14px; }
.lines li::before { content: ""; position: absolute; left: 0; top: .66em; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.lines li.gold { font-weight: 700; } .lines li.gold::before { background: var(--gold); } .lines li.red::before { background: var(--red); } .lines li.life::before { background: var(--blue); }
.memo { font-style: italic; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }

/* press */
.press { display: flex; flex-direction: column; gap: 8px; }
.clip { margin: 0; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 10px 13px 12px; box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 0 0 1px rgba(0, 0, 0, .05); }
.clip figcaption { display: flex; align-items: baseline; gap: 8px; border-bottom: 1.5px solid var(--paper-ink); padding-bottom: 4px; margin-bottom: 6px; }
.clip .mast { font-family: var(--f-serif); font-weight: 900; font-size: 13px; }
.clip .where { font-size: 11px; color: var(--paper-muted); margin-left: auto; }
.clip .hl { font-family: var(--f-serif); font-weight: 700; font-size: 17px; line-height: 1.4; }
.rvlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.rvlist li { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: baseline; font-size: 13.5px; padding: 8px 12px; background: var(--panel-2); border-radius: 10px; }
.rvlist .mast { font-family: var(--f-serif); font-weight: 900; font-size: 12.5px; white-space: nowrap; }
.rvlist .rate { color: var(--gold); white-space: nowrap; font-weight: 900; }
@media (max-width: 520px) { .rvlist li { grid-template-columns: auto 1fr; } .rvlist .rl { grid-column: 1 / -1; } }
.pyear { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }

/* tables & lists */
.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--r-sm); background: var(--panel-2); }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
.tbl td.small, .tbl td:has(.small.muted) { white-space: normal; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 700; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.grp td { background: var(--panel-3); font-weight: 900; font-size: 12.5px; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.ach { white-space: normal; min-width: 220px; max-width: 340px; overflow-wrap: normal; word-break: keep-all; }
.achi { display: inline-block; font-size: 11.5px; font-weight: 700; line-height: 1.5; padding: 1px 7px; margin: 0 4px 4px 0; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.achi.tr { background: var(--gold-bg); color: var(--gold); }
.achi.up { background: var(--pos-bg); color: var(--pos); }
.wstar { color: var(--gold); letter-spacing: -.05em; font-size: .92em; }
.foot { white-space: nowrap; }
.trophies { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.trophies li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.trophies li .num { color: var(--gold); font-weight: 900; }
.trophies li .small { grid-column: 1 / -1; }
.memos { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.memos p { margin-top: 2px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.prose p, .prose li { max-width: 72ch; color: #39415a; }
.prose h2 { font-size: 17px; margin-top: 10px; }
.prose b { color: var(--ink); }

/* career card */
.careercard { --ink: #edf0f7; --muted: #8b95ae; --faint: #5e6884; --line: rgba(255, 255, 255, .1); --soft: rgba(255, 255, 255, .06); --panel-2: #1b2440; --panel-3: #232e50; --gold: #e9bc55; --gold-bg: rgba(233, 188, 85, .14); --gold-ink: #1c1406; --pos: #5ad59b; --red: #ff7a6d; background: #0c1222; color: var(--ink); border-radius: 22px; padding: 24px 22px; display: flex; flex-direction: column; gap: 12px; max-width: 480px; width: 100%; margin: 0 auto; box-shadow: inset 0 0 0 1.5px rgba(233, 188, 85, .6); background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgba(255, 255, 255, .025) 18px 36px); }
.careercard .eyebrow { color: var(--gold); }
.cc-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.cc-mid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.cc-mid > div { display: flex; flex-direction: column; min-width: 0; } .cc-mid .right { align-items: flex-end; text-align: right; }
.cc-ava { display: flex; justify-content: center; }
.cc-ovr { font-size: 50px; font-weight: 900; line-height: 1; color: var(--gold); letter-spacing: -.03em; }
.cc-lbl { font-size: 10.5px; font-weight: 900; letter-spacing: .08em; color: var(--gold); }
.cc-pos { font-size: 24px; font-weight: 900; margin-top: 6px; }
.cc-name { font-size: clamp(24px, 6vw, 32px); font-weight: 900; letter-spacing: -.02em; text-align: center; }
.cc-sub { text-align: center; font-size: 14px; color: var(--muted); }
.cc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 0; text-align: center; }
.cc-stats b { display: block; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.cc-stats span { font-size: 11.5px; font-weight: 700; color: var(--gold); }
.cc-badges { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.cc-clubs { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.cc-clubs > span { display: flex; flex-direction: column; align-items: center; gap: 4px; } .cc-clubs small { font-size: 11px; color: var(--muted); font-weight: 700; }
.careercard p { text-align: center; }
.sampleout { white-space: pre-wrap; background: var(--panel-2); border-radius: var(--r-sm); padding: 14px; font-size: 14px; }

/* new career */
.newtop { display: flex; gap: 16px; align-items: center; }
.newtop .grow { display: flex; flex-direction: column; gap: 10px; }
.lookbox { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.lookprev { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.lookctl { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lrow { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.sws { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold); }
.sw.none { background: var(--panel-2); color: var(--muted); font-size: 13px; }
@media (max-width: 520px) { .lookbox { grid-template-columns: 1fr; } .lookprev { flex-direction: row; } .attr { grid-template-columns: 82px 1fr 28px; } .ph-ovr .big { font-size: 38px; } .careercard .px.lg { width: 104px; height: 130px; } .cc-ovr { font-size: 40px; } .newtop .px.lg { width: 104px; height: 130px; padding: 5px 7px 2px; } .newtop .row .btn { padding: 8px 10px; } .meter { grid-template-columns: 28px 1fr; gap: 6px; } }

/* emblem manager */
.crestlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.crow { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; }
.lgchips { display: flex; flex-wrap: wrap; gap: 6px; }

.cut { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden; cursor: pointer; color: #fff; background: radial-gradient(ellipse at 50% 42%, #2a3566 0%, #121833 45%, #05070f 100%); animation: cutbg .35s ease-out; }
.cut.ball { background: radial-gradient(ellipse at 50% 42%, #5a4416 0%, #24190a 50%, #070502 100%); }
.cut-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cut-rays { position: absolute; left: 50%; top: 40%; width: 160vmax; height: 160vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, rgba(246, 214, 136, .13) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%); animation: cutspin 24s linear infinite, cutfade .8s ease-out; opacity: .9; }
.cut.lvl1 .cut-rays { opacity: .45; }
.cut-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 20px; text-align: center; max-width: 560px; }
.cut-eye { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: #f6d688; opacity: 0; animation: cutup .5s .1s ease-out forwards; }
.cut-trophy { width: clamp(120px, 34vw, 190px); filter: drop-shadow(0 0 24px rgba(246, 214, 136, .55)); opacity: 0; animation: cutpop .7s .15s cubic-bezier(.2, 1.6, .4, 1) forwards; }
.cut.lvl1 .cut-trophy { width: clamp(100px, 26vw, 140px); }
.cut-trophy svg { width: 100%; height: auto; display: block; }
.cut-title { font-size: clamp(34px, 10vw, 64px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; margin: 4px 0 0; text-shadow: 0 2px 0 #8a5a10, 0 0 30px rgba(246, 214, 136, .5); color: #fff4cf; }
.cut-title span { display: inline-block; opacity: 0; transform: translateY(18px) scale(.7); animation: cutletter .45s cubic-bezier(.2, 1.5, .4, 1) forwards; }
.cut-sub { font-size: 15px; font-weight: 700; color: #e9e2cf; opacity: 0; animation: cutup .5s .9s ease-out forwards; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.cut-chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(246, 214, 136, .16); box-shadow: inset 0 0 0 1px rgba(246, 214, 136, .55); color: #f6d688; opacity: 0; animation: cutup .4s ease-out forwards; }
.cut-who { display: flex; align-items: center; gap: 10px; margin-top: 8px; opacity: 0; animation: cutup .5s 1.2s ease-out forwards; text-align: left; }
.cut-who span { display: flex; flex-direction: column; } .cut-who b { font-size: 16px; } .cut-who small { font-size: 12.5px; color: #c9c3b2; display: flex; align-items: center; gap: 5px; }
.cut-tap { font-size: 12px; color: rgba(255, 255, 255, .55); margin-top: 6px; opacity: 0; transition: opacity .4s; }
.cut.ready .cut-tap { opacity: 1; animation: cutblink 1.6s ease-in-out infinite; }
@keyframes cutbg { from { opacity: 0; } }
@keyframes cutfade { from { opacity: 0; } }
@keyframes cutspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes cutup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes cutpop { 0% { opacity: 0; transform: scale(.3) rotate(-8deg); } 100% { opacity: 1; transform: none; } }
@keyframes cutletter { to { opacity: 1; transform: none; } }
@keyframes cutblink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .cut, .cut *, .cut-rays { animation-duration: .01s !important; animation-delay: 0s !important; } }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; z-index: 10; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
button, .btn, label, summary, .evopt, .chip, .numc { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 879px) { .inp, select.inp, textarea.inp { font-size: 16px; } .numc { height: 42px; font-size: 14px; } .numgrid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); } }
@media (hover: none) { .evopt:hover, .btn:hover, .lcard:hover { background: var(--panel-2); } .btn.primary:hover { background: var(--gold); } }
@media (prefers-reduced-motion: no-preference) { .event, .result { animation: rise .3s ease-out; } @keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } } }

/* v7: 리그 단계·대회 칩 */
.lgtag { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.div { font-size: 10.5px; font-weight: 900; padding: 0 6px; border-radius: 5px; line-height: 1.7; background: var(--panel-3); color: var(--muted); }
.div.d1 { background: var(--ink); color: #fff; }
.comp { font-size: 10.5px; font-weight: 700; padding: 0 7px; border-radius: 5px; line-height: 1.7; background: var(--soft); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.comp.ucl { background: #16245c; color: #fff; box-shadow: none; } .comp.uel { background: #f08a1c; color: #fff; box-shadow: none; } .comp.uecl { background: #1f9e6e; color: #fff; box-shadow: none; } .comp.cont { background: var(--gold-bg); color: var(--gold); box-shadow: none; }
.fee { font-variant-numeric: tabular-nums; }
/* 오프시즌 변화 */
.chg { gap: 4px; font-size: 14px; padding: 12px 16px; }
.chg .sumlbl { font-size: 12.5px; } .chg p > span { white-space: nowrap; }
.chg .up { color: var(--pos); font-weight: 700; } .chg .dn { color: var(--red); font-weight: 700; } .chg .sep { color: var(--faint); }
.ar { font-size: 10px; margin-left: 3px; font-weight: 900; } .ar.up { color: var(--pos); } .ar.dn { color: var(--red); }
/* 훈련 ↔ 능력치 */
.attr { cursor: pointer; border-radius: 8px; margin: 0 -6px; padding: 2px 6px; transition: background .15s; }
button.attr { grid-template-columns: 96px 1fr 30px 18px; }
@media (max-width: 520px) { button.attr { grid-template-columns: 80px 1fr 26px 16px; } }
.attr .arc { text-align: left; white-space: nowrap; } .attr .arc .ar { margin-left: 0; }
button.attr { border: 0; background: none; width: calc(100% + 12px); text-align: left; font: inherit; color: inherit; min-height: 30px; }
.attr:hover { background: var(--soft); }
.attr.tf { background: var(--gold-bg); }
.attr.tf .an { color: var(--gold); font-weight: 900; }
.attr.tf .bar i { background: var(--gold); }
.bar { position: relative; } .bar .gh { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(90deg, rgba(154, 106, 8, .45) 0 3px, rgba(154, 106, 8, .18) 3px 6px); border-radius: 0 4px 4px 0; }
.attr .an { display: flex; align-items: center; }
.ftip { font-size: 12.5px; color: var(--muted); }
/* 등번호 요구 */
.numc.ask:disabled { opacity: .3; }
.numc.ask { opacity: .55; text-decoration: line-through; text-decoration-color: rgba(0, 0, 0, .35); }
.numc.ask:hover { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--gold); }
.numc.granted { box-shadow: inset 0 0 0 2px var(--pos); }
/* 일기 */
.diary-q { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.diary-q b { color: var(--gold); flex: none; font-size: 12px; }
.diary-q .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; }
.diary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.diary li { display: grid; grid-template-columns: 78px 1fr; gap: 10px; }
.diary .dd { font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.4; }
.diary .dd b { display: block; font-size: 14px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.diary .dq { font-size: 12.5px; color: var(--gold); font-weight: 700; margin-bottom: 2px; }
.diary .dt { font-family: var(--f-serif); font-size: 15px; line-height: 1.75; white-space: pre-wrap; }
/* 대표팀 경기 전 맥락 */
.ctx { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ctx span { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.ctx span.hot { background: var(--red-bg); color: var(--red); } .ctx span.cool { background: var(--pos-bg); color: var(--pos); }
/* 기질 공개 */
.tmp { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.tmp-l { font-size: 11px; font-weight: 900; letter-spacing: .1em; color: var(--muted); }
.tmp-n { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tmp-n b { font-family: var(--f-serif); font-size: 22px; font-weight: 900; color: var(--gold); padding: 2px 14px; border-radius: 10px; background: var(--gold-bg); }
.tmp-d { font-size: 12px; color: var(--muted); }
.tmp-e { font-size: 12.5px; color: var(--ink); opacity: .85; text-align: center; line-height: 1.5; }
.lc-tmp { font-size: 11px; font-weight: 900; color: var(--gold); }
.hoflist .retnum { font-size: 15px; }

/* v8: 계약 조건 · 커리어 결정 */
.terms .tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.terms .tgrid > div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.terms .tgrid span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.terms .tgrid b { font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.terms .tgrid small { font-size: 11.5px; font-weight: 700; } .terms .tgrid small.pos { color: var(--pos); } .terms .tgrid small.neg { color: var(--red); }
.drow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
.drow + .drow { border-top: 1px solid var(--line); }
.vs .crest.md { width: 34px; height: 37px; }

/* v9: 커리어 갈림길 · 세계선 */
.ol { display: flex; flex-wrap: wrap; gap: 2px 0; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.ol > span { display: inline-flex; align-items: center; gap: 4px; }
.ol > span:not(:last-child)::after { content: "·"; color: var(--faint); margin: 0 6px; }
.meters .pill { white-space: normal; min-width: 0; max-width: 100%; line-height: 1.35; }
.ol b { color: var(--ink); font-weight: 700; }
.ol .race.hi { color: var(--gold); font-weight: 700; } .ol .race.lo { color: var(--red); }
.ol .hist { color: #5b4bb5; }
.linebar { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.ltree { list-style: none; margin: 6px 0 0; padding: 0 0 0 14px; border-left: 2px solid rgba(91, 75, 181, .35); display: flex; flex-direction: column; gap: 12px; }
.ltree.root { border-left: 0; padding-left: 0; }
.ln { display: flex; flex-direction: column; gap: 3px; }
.ln-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ln-h .btn { margin-left: auto; }
.ln.on > .ln-h b { color: #5b4bb5; }
.cstrip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; height: 22px; margin-top: 4px; }
.cy { border-radius: 3px; background: var(--panel-3); min-width: 0; }
.cy.t1 { background: var(--gold); } .cy.t2 { background: #7d8db5; } .cy.t4 { background: rgba(201, 58, 48, .4); }
.cy.cw { background: linear-gradient(180deg, var(--gold) 55%, #16245c 55%); }
.cy.rec { box-shadow: inset 0 0 0 1.5px var(--ink); }
.cstrip-l { display: flex; justify-content: space-between; }
.chron { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ce { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--panel-2); }
.ce-y { font-size: 12.5px; font-weight: 700; color: var(--muted); padding-top: 1px; }
.ce.gold, .ce.num, .ce.hof { background: var(--gold-bg); } .ce.fall { background: var(--red-bg); } .ce.rise { background: var(--pos-bg); } .ce.era, .ce.return, .ce.coach { background: rgba(91, 75, 181, .08); }
.cc-best { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cc-best > div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; text-align: left; }
.cc-best span { font-size: 10.5px; font-weight: 900; letter-spacing: .06em; color: var(--gold); }

  // 감독 신뢰를 빨리 얻는 역할
  const ROLE_TRUST = { leadercb: 4, trackback: 3, carrilero: 3, anchor: 2, holdfb: 2, defwb: 2, presser: 2 };

  // ---------- FOOT ----------
  // 주발(L/R)과 약발 등급(1~5). 측면 역할은 발 방향이 맞으면 보너스, 안 맞으면 약발이 낮을수록 손해.
  const FOOT_NAME = { L: '왼발', R: '오른발' };

  function footAdj(p, roleId) {
    if (!p.foot || p.pos === 'GK') return 0;

  function weakChance(p, mgr, mods) {

  // ---------- ROLE FAMILIARITY ----------
  // 형성기(21세까지)에는 직접 역할을 고르고, 22세부터는 감독이 정한다. 뛴 역할마다 숙련도가 쌓인다.

  function make(kind, p, v = {}, outKey) {

    const cont = res.trophies.find(x => x.type === 'cont'); const contF = res.finals.find(f => ['코파 리베르타도레스', 'AFC 챔피언스리그'].includes(f.comp) && !f.won);
    if (cont) L.push(...both('contwin', p, { comp: cont.comp })); else if (contF) L.push(...both('contloss', p, { comp: contF.comp }));

      { label: '듣지 않는다', hint: '사기 +1', run(x) { return H(x).b('morale', 1); } },

      { label: '경기력으로 답한다', hint: '해 봐야 안다', run(x) { const h = H(x); if (chance(.6)) { h.mod('form', .04); return '이를 악물었다.'; } h.mod('form', -.03); return '자꾸 그 말이 떠올랐다.'; } },
      { label: 'SNS로 받아친다', hint: '팬심 +3 · 명성 −2', run(x) { const h = H(x); return [h.b('fans', 3), h.b('rep', -2)].join(' · '); } },
      { label: '무시한다', hint: '사기 −2', run(x) { return H(x).b('morale', -2); } },

  def({ id: 'markman', phase: 'mid', cd: 3, w: (c) => pro(c.p) && (grp(c.p) === 'DF' || c.p.pos === 'DM') ? 6 : 0, make(c) {

      { label: '그림자가 된다', hint: '감독 신뢰 +5 · 해 봐야 안다', run(x) { const h = H(x); if (chance(.6)) { h.note(`${star} 지우기`); h.mod('rating', .04); return `${star}가 슈팅 하나 없이 교체됐다. ` + h.b('trust', 5); } return `${star}에게 두 번 뚫렸다. 그래도 감독은 고개를 끄덕였다. ` + h.b('trust', 3); } },
      { label: '내 방식대로 막겠다고 한다', hint: '감독 신뢰 −4 · 사기 +2', run(x) { const h = H(x); return [h.b('trust', -4), h.b('morale', 2)].join(' · '); } },

  def({ id: 'pkstudy', phase: 'pre', cd: 5, w: (c) => pro(c.p) && c.p.pos === 'GK' ? 8 : 0, make(c) {

      { label: '매일 밤 외운다', hint: '평점 소폭 상승 · 사기 −1', run(x) { const h = H(x); h.mod('rating', .03); x.p.flags.pknote = x.p.year; return h.b('morale', -1); } },
      { label: '감으로 뛴다', hint: '사기 +2', run(x) { return H(x).b('morale', 2); } },
    ] };
  } });
  def({ id: 'pkgift', phase: 'mid', cd: 4, w: (c) => pro(c.p) && grp(c.p) === 'FW' ? 5 : 0, make(c) {

      { label: `${m}에게 공을 건넨다`, hint: '감독 신뢰 +3 · 사기 +2', run(x) { const h = H(x); return `${m}가 넣고 너를 안았다. ` + [h.b('trust', 3), h.b('morale', 2)].join(' · '); } },

    ] };
  } });
  def({ id: 'kidletter', phase: 'mid', cd: 8, w: (c) => pro(c.p) && c.p.rep >= 10 ? 4 : 0, make(c) {
    const n = NAMES.gen(lgOf(c.p).country === '대한민국' ? '대한민국' : c.p.nation).split(' ')[0];
    return { title: '병원에서 온 편지', tone: 'life', text: `소아 병동에 있는 ${n}가 크레파스로 쓴 편지가 왔다. "다음 경기에서 골 넣으면 저 퇴원할 수 있대요."`, options: [
      { label: '병원에 찾아간다', hint: '사기 +5 · 팬심 +3', run(x) { const h = H(x); h.note(`어린 팬 ${n} 병문안`); return [h.b('morale', 5), h.b('fans', 3)].join(' · '); } },
      { label: '골을 약속한다', hint: '해 봐야 안다', run(x) { const h = H(x); if (chance(.55)) { h.mod('form', .03); h.note(`${n}에게 약속한 골`); return '약속을 지켰다. 세리머니로 하트를 그렸다. ' + h.b('rep', 3); } return '골은 나오지 않았다. 경기 후 병원으로 유니폼을 보냈다. ' + h.b('morale', -2); } },
    ] };
  } });
  def({ id: 'ownerpet', phase: 'mid', cd: 6, w: (c) => pro(c.p) && c.p.rep >= 20 ? 3 : 0, make(c) {

      { label: '구단주와 가깝게 지낸다', hint: '명성 +2 · 감독 신뢰 −5', run(x) { const h = H(x); return [h.b('rep', 2), h.b('trust', -5)].join(' · '); } },
      { label: '"감독님이 결정할 일"이라고 선을 긋는다', hint: '감독 신뢰 +4', run(x) { return H(x).b('trust', 4); } },

  } });
  def({ id: 'fixture', phase: 'mid', cd: 4, w: (c) => pro(c.p) && c.p.age >= 22 ? 5 : 0, make(c) {

      { label: '다 뛰겠다', hint: '감독 신뢰 +4 · 내구도 −4 · 가벼운 부상 위험', run(x) { const h = H(x); const r = [h.b('trust', 4), h.b('dur', -4)]; if (chance(.25)) { h.mod('injWeeks', 3); r.push('종아리가 올라왔다'); } return r.join(' · '); } },

  def({ id: 'oldfriend', phase: 'mid', cd: 10, w: (c) => pro(c.p) && c.p.age >= 25 ? 3 : 0, make(c) {

      { label: '구단 스카우트 자리를 추천한다', hint: '사기 +4 · 감독 신뢰 +1', run(x) { const h = H(x); h.note(`유스 동기 ${m}를 스카우트로 추천`); return [h.b('morale', 4), h.b('trust', 1)].join(' · '); } },

      { label: '"우리끼리 할 말이었다"', hint: '감독 신뢰 +2 · 팬심 +2', run(x) { const h = H(x); return [h.b('trust', 2), h.b('fans', 2)].join(' · '); } },

  // ---------- POST ----------
  def({ id: 'snub', phase: 'post', cd: 3, w: (c) => { const r = c.res; return r && !r.youthTeam && r.rating >= 7.15 && r.apps >= 25 && !r.awards.length ? 40 : 0; }, make(c) {

      { label: '지금 수술한다', hint: '내구도 +5 · 다음 시즌 초반 결장', run(x) { const q = x.p; E.bump(q, 'dur', 5); q.nextMods = Object.assign({}, q.nextMods); q.nextMods.share = (q.nextMods.share || 0) - .08; return '깨끗하게 정리했다. 내구도 +5'; } },

  def({ id: 'memoir', phase: 'post', cd: 10, w: (c) => pro(c.p) && c.p.age >= 30 && c.p.rep >= 30 && !c.p.flags.memoir ? 4 : 0, make(c) {

  const snubbed = (p) => Object.keys(p.flags).filter(k => k.startsWith('snub_') && p.flags[k]).map(k => k.slice(5)).find(id => E.CLUB[id] && E.CLUB[id].lg === E.CLUB[p.club]?.lg && id !== p.club);
  def({ id: 'snubboo', phase: 'mid', cd: 3, w: (c) => pro(c.p) && snubbed(c.p) ? 30 : 0, make(c) {
    const p = c.p; const id = snubbed(p);
    return { title: `${club(id)} 원정`, tone: 'bad', text: `러브콜을 일축한 뒤 처음 찾는 옛 홈구장. 몸을 풀 때부터 야유가 쏟아진다. 관중석에 "${p.number || ''}번은 죽었다"는 걸개가 걸렸다.`, options: [
      { label: '골을 넣고 세리머니를 참는다', hint: '해 봐야 안다', run(x) { const h = H(x); if (chance(.45)) { E.bump(x.p, 'fans', 6, id); h.note(`${club(id)} 원정에서 득점, 세리머니 자제`); return '골을 넣고 두 손을 들었다. 야유 사이로 박수가 섞였다.'; } return '골은 없었다. 야유만 남았다. ' + h.b('morale', -3); } },

    ] };
  } });
  // ---------- 작은 일상들 ----------
  def({ id: 'turbulence', phase: 'mid', cd: 8, w: (c) => pro(c.p) ? 3 : 0, make(c) {

      { label: '버스로 가겠다고 한다', hint: '내구도 −2 · 사기 +1', run(x) { const h = H(x); x.p.flags.noFly = x.p.year; return [h.b('dur', -2), h.b('morale', 1)].join(' · '); } },
      { label: '다시 비행기를 탄다', hint: '사기 −2 · 해 봐야 안다', run(x) { const h = H(x); if (chance(.5)) return '두 번째 비행은 조용했다. 괜찮아졌다.'; return '이륙할 때마다 눈을 감는다. ' + h.b('morale', -2); } },
    ] };
  } });
  def({ id: 'fanwedding', phase: 'mid', cd: 8, w: (c) => pro(c.p) && (c.p.fans[c.p.club] || 0) >= 55 ? 4 : 0, make(c) {
    return { title: '팬의 청첩장', tone: 'life', text: '시즌권 20년 차 부부의 아들이 결혼한다. 청첩장에 "오시면 평생의 자랑이겠습니다"라고 적혀 있다.', options: [
      { label: '깜짝 등장한다', hint: '팬심 +6 · 명성 +1', run(x) { const h = H(x); h.note('팬의 결혼식에 깜짝 등장'); return [h.b('fans', 6), h.b('rep', 1)].join(' · '); } },

  } });
  def({ id: 'bus', phase: 'mid', cd: 10, w: (c) => pro(c.p) && c.p.rep >= 15 ? 3 : 0, make(c) {

      { label: '지하철을 탄다', hint: '팬심 +5 · 명성 +2', run(x) { const h = H(x); h.note('지하철 출근 영상이 퍼지다'); return '승객이 찍은 영상이 퍼졌다. ' + [h.b('fans', 5), h.b('rep', 2)].join(' · '); } },
      { label: '동료에게 태워 달라고 한다', hint: '사기 +1', run(x) { return '조수석에서 한 시간 동안 잔소리를 들었다. ' + H(x).b('morale', 1); } },

    ] };
    return { ...base, options: [
      { label: '완치될 때까지 쉰다', hint: `${inj.weeks}주 · 재발 없음`, run(x) { return rec(x, inj.weeks, 0, '서두르지 않았다.'); } },
      { label: '빠른 복귀 프로그램', hint: `${Math.max(1, Math.round(inj.weeks * .6))}주 · 35% 재발`, run(x) { if (chance(.35)) { E.bump(x.p, 'dur', -6); return rec(x, Math.round(inj.weeks * 1.3), 0, '복귀전에서 재발했다. 내구도 −6.'); } return rec(x, Math.max(1, Math.round(inj.weeks * .6)), 0, '예정보다 빨리 돌아왔다.'); } },

    ] };
  }

  // ---------- DRAW ----------
  function draw(phase, ctx, n) {
    const p = ctx.p; p.evLog = p.evLog || {};
    const cands = D.filter(d => d.phase === phase).map(d => ({ d, w: (() => { try { return d.w(ctx) || 0; } catch { return 0; } })() })).filter(x => x.w > 0 && !(p.evLog[x.d.id] != null && x.d.cd > 0 && p.year - p.evLog[x.d.id] < x.d.cd));
    const forced = cands.filter(c => c.w >= 60).sort((a, b) => b.w - a.w).slice(0, 2);
    const rest = cands.filter(c => c.w < 60);
    const chosen = [...forced];
    for (let i = 0; i < n && rest.length; i++) { const total = rest.reduce((a, b) => a + b.w, 0); let u = R() * total; const ch = rest.find(c => (u -= c.w) <= 0) || rest[0]; rest.splice(rest.indexOf(ch), 1); chosen.push(ch); }
    const out = [];
    for (const ch of chosen) { try { const inst = ch.d.make(ctx); if (inst && inst.options?.length) { inst.id = ch.d.id; out.push(inst); p.evLog[ch.d.id] = p.year; } } catch (e) { console.warn('event', ch.d.id, e); } }
    return out;
  }
  // how many random events: window up to 2 (forced first), pre 1, mid 2, post up to 2
  function seasonQueue(ctx) {

    return q;
  }
  return { draw, seasonQueue, injuryEvent, count: () => D.length, ids: () => D.map(d => d.id), _all: () => D, nickShow, localNick };
})();

  // 선택지 힌트는 결과 수치를 숨기고 분위기만 흘린다. 돈·기간·이적처럼 결정에 꼭 필요한 사실만 남긴다.
  const VEIL = {

    home: [['친정 팬들이 기억할 것이다'], ['친정 팬들은 잊지 않을 것이다'], ['친정 팬들이 기억할 것이다'], ['친정 팬들은 잊지 않을 것이다']],
    rep: [['이름이 더 알려질 것이다', '기자들이 좋아할 이야기다'], ['평판에 흠이 갈 수도', '좋은 기사는 안 나올 것 같다'], ['세상이 이름을 기억할 것이다'], ['오래 따라다닐 꼬리표가 될지도']],
    dur: [['몸이 쉴 틈을 얻는다', '몸이 고마워할 것이다'], ['몸이 버텨 줄지 모르겠다', '몸에 무리가 갈 수도'], ['몸이 새로 태어날 것 같다'], ['몸이 대가를 치를 것이다']],
    form: [['감이 올 것 같다', '발끝이 가벼워질지도'], ['감이 흔들릴 수도', '경기력엔 손해일지도'], ['무언가 깨어날 것 같다'], ['한동안 헤맬 것이다']],
    grow: [['한 뼘 자랄지도', '배우는 게 있을 것이다'], ['성장엔 손해일 수도', '시간을 잃는 느낌이다'], ['다른 선수가 될지도 모른다'], ['잃는 게 클 수도']],
    share: [['더 자주 뛰게 될지도'], ['벤치에 앉는 날이 늘지도'], ['자리를 꿰찰지도'], ['한동안 못 뛸 수도']],
  };
  const VK = [['친정 팬심', 'home'], ['아버지 팀 팬심', 'home'], ['옛 팬심', 'home'], ['감독 신뢰', 'trust'], ['팬심', 'fans'], ['사기', 'morale'], ['명성', 'rep'], ['내구도', 'dur'], ['몸', 'dur'], ['다음 시즌 폼', 'form'], ['대표팀 경기력', 'form'], ['폼', 'form'], ['평점', 'form'], ['핵심 능력치', 'grow'], ['다음 시즌 성장', 'grow'], ['성장', 'grow'], ['천장', 'grow'], ['출전 시간', 'share'], ['출전', 'share']];
  const VW = { rep: 2.2, grow: 1, form: 1, share: 1 };
  const hashS = (s) => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
  function veil(hint, seed) {
    if (!hint) return '';
    let h = hashS(seed + (S.p?.id || '') + (S.p?.year || '')); const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; return (h % 1000) / 1000; };
    const eff = []; const keep = [];
    const statRe = new RegExp('(' + VK.map(x => x[0]).join('|') + ')\\s*(소폭\\s*)?([+−-]\\s*[\\d.]+|×\\s*[\\d.]+|▲▲|▼▼|▲|▼|↑|↓|상승|하락|둔화)');

  function seasonLines(r) {

      <h2>화면 표기 읽는 법</h2><ul>
        <li><b>▲ / ▼</b>는 수치가 오르거나 내린다는 뜻이고, <b>▲▲ / ▼▼</b>는 10 이상 크게 움직인다는 뜻이에요.</li>
        <li>확률 표현: <b>거의 확실히</b> 80% 이상 · <b>높은 확률로</b> 60~79% · <b>반반으로</b> 45~59% · <b>낮은 확률로</b> 25~44% · <b>드물게</b> 25% 미만. 위험도는 높음 60%+ · 꽤 있음 40%+ · 있음 25%+ · 낮음.</li>
        <li><b>역할 적성 글자</b>는 (역할 적성 − 오버롤) 기준이에요. S +4 이상 · A +1.5 · B ±1.5 · C −4 · D 그 아래.</li>
        <li><b>출전 표현</b>: 붙박이 주전 80%+ · 주전 60%+ · 로테이션 40%+ · 교체 자원 20%+ · 벤치.</li>
        <li><b>이번 오프시즌 변화</b>: 지난 시즌 동안 0.6 이상 오른 능력치 셋, 내린 능력치 둘. ▲▲ / ▼▼는 2 이상. 능력치 창의 화살표도 같은 기준이에요.</li>
        <li><b>리그 표시</b>: 1부·2부, 그리고 그 시즌 나가는 대륙 대회(챔스·유로파·컨퍼런스·리베르타도레스·ACL). 대륙 대회는 지난 시즌 순위로 정해지고, 내가 그 구단에서 뛴 시즌이면 내 시즌의 실제 순위를 써요.</li>
        <li><b>훈련 ↔ 능력치</b>: 훈련 초점이 닿는 능력치는 금색, 옅은 줄무늬는 이번 시즌 예상 성장(무작위 요소를 뺀 기댓값, 출전 비율은 지난 시즌 기준)이에요.</li></ul>
      <h2>오버롤과 역할 적성</h2><p>오버롤은 포지션마다 다른 능력치 가중 평균이에요. 역할 적성은 그 역할의 핵심 능력치 평균이에요. 공격 포인트와 평점은 둘을 섞어서 계산하기 때문에, 같은 오버롤이라도 역할에 맞는 능력치를 가진 선수가 더 잘해요.</p>
      <div class="tblwrap"><table class="tbl"><tbody>${posRows}</tbody></table></div>
      <h2>성장</h2><ul>
        <li>나이별 기본 성장치(16~17세 최대, 29세부터 하락)에 출전 비율(0.55~1.3배), 감독 능력, 사기, 사건 효과가 곱해져요.</li>
        <li><b>18~25세 출전 보너스.</b> 출전 비율 65% 이상인 시즌마다 천장 +0.75(최대 +5), 30% 미만이면 −0.9.</li>
        <li><b>훈련 초점.</b> 고른 능력치는 1.7배, 나머지는 0.78배로 자라요. 능력치 창에서 막대 하나를 누르면 그 능력치만 2배로 집중해요(다시 누르면 포지션 맞춤으로).</li>
        <li><b>주발과 약발.</b> 주발은 만들 때 고르고(랜덤이면 왼발 24%), 약발 등급 ★1~5는 운으로 정해져요(★2·★3이 대부분, ★5는 3%). 측면 포지션에서 역할이 원하는 발(정통 윙어·오버래핑 계열은 같은 쪽 발, 인버티드·인사이드 계열은 반대 발)이면 역할 적성 +1.2, 아니면 약발이 낮을수록 최대 −2.4. ★5는 어느 쪽이든 +1.2. 약발 등급 자체도 역할 적성에 (등급 − 3) × 0.2~0.6을 더해요. 왼발 센터백·풀백은 이적 제안이 1.25배.</li>
        <li><b>약발 훈련.</b> 훈련 초점에서 고르면 다른 능력치는 모두 0.8배로 자라고, 시즌 끝에 약발이 한 등급 오를 확률이 생겨요. 17세 이하 60% · 19세 이하 50% · 21세 이하 40% · 23세 이하 26% · 25세 이하 15% · 28세 이하 7% · 그 위 2%에, 다음 등급이 ★3 이하면 ×1.05~1.15, ★4면 ×0.85, ★5면 ×0.5. 감독 능력에 따라 조금 달라져요. 훈련하지 않으면 약발은 오르지 않아요.</li>
        <li>시야·침투·수비 지능·위치선정 같은 두뇌 능력치는 26~32세에도 조금씩 오르고, 속도·피지컬은 27세부터 정체되다가 30세 이후 1.5배로 떨어져요.</li></ul>
      <h2>사기·신뢰·팬심·명성·내구도</h2><ul>
        <li><b>사기</b>는 평점과 성장에, <b>감독 신뢰</b>는 출전 시간에 영향을 줘요. 이적하면 신뢰는 다시 쌓아야 해요.</li>
        <li><b>팬심</b>은 구단마다 따로 쌓여요. 오래 사랑받으면 은퇴할 때 영구결번이 되고, 친정 러브콜이 와요. 라이벌 구단으로 이적하면 크게 떨어져요.</li>
        <li><b>명성</b>은 대표팀 소집, 빅클럽 제안, 발롱도르 투표, 광고·다큐 같은 사건에 영향을 줘요.</li>
        <li><b>내구도</b>가 낮을수록 부상이 잦아요. 무리한 복귀는 내구도를 깎아요.</li></ul>
      <h2>사건</h2><p>매 시즌 이적 시장 사건(45%), 프리시즌 사건(45%), 시즌 중 사건 1개(20%는 2개), 부상, 시즌 후 사건(35%)이 일어나요. 반드시 일어나는 사건(재계약, 첫 대표팀 소집, 입영 통지 등)은 따로 붙어요. 사건은 140가지가 넘고, 나이·성격·구단·사기·지난 선택 같은 조건에 따라 뽑혀요. 몇몇은 몇 시즌 뒤에 돌아와요. 십자인대나 아킬레스건 파열은 능력치를 영구적으로 깎을 수 있어요.</p><p>선택지에는 결과가 숫자로 나오지 않아요. 돈·기간·이적처럼 결정에 꼭 필요한 사실만 적히고, 나머지는 분위기만 흘려요. 그 말도 가장 큰 효과 하나쯤만 비추고, 가끔은 아무 말도 하지 않아요. 고른 뒤에야 무엇이 오르고 내렸는지 보여요.</p><p>아주 드물게, 커리어의 방향을 통째로 바꾸는 일이 일어나요(대략 네 커리어에 하나). 어떤 일인지는 여기 적지 않아요. 그런 일은 한 시즌으로 끝나지 않고 몇 시즌에 걸쳐 그림자나 빛을 남기고, 그 사이 다시 선택할 기회가 와요.</p>
      <h2>역할</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>역할</th><th class="num">골 / 도움</th><th>핵심 능력치</th><th>좋아하는 감독</th></tr></thead><tbody>${roleRows}</tbody></table></div>
      <h2>숨겨진 재능</h2><ul>
        <li><b>잠재력</b>은 생성할 때 몰래 굴려요. 62%는 평범(평균 77), 31%는 기대주급(82.5), 7%는 원더키드급(88). 가문 후손은 부모 피크 오버롤을 35% 물려받아요. 자유 설정에서 직접 고르면 그 범위에서 굴려요.</li>
        <li><b>성장 곡선</b>: 조숙형 25%(20세까지 성장 ×1.3, 24세부터 ×0.55, 노쇠 1년 빨리) · 보통 55% · 대기만성형 20%(19세까지 ×0.62, 22~28세 ×1.75, 노쇠 2년 늦게. 18~25세 벤치 페널티도 절반).</li>
        <li><b>스카우트 별점</b>은 (잠재력 + 출전 보너스 × 0.6)에 나이별 오차를 더해요. 16세 오차 표준편차 7, 해마다 0.75씩 줄어 1.5까지. 대기만성형은 22세 전까지 3.5 낮게, 조숙형은 21세 전까지 2.5 높게 보여요.</li>
        <li><b>1군 승격 심사</b>(18세): 전력 76 이상 구단 유스는 OVR이 (전력 − 22) 근처면 반반, 2.5 차이마다 확률이 크게 바뀌어요. 탈락해도 기준에서 5 이내면 임대나 2군 잔류를 고를 수 있고, 더 멀면 방출돼서 새 팀을 찾아야 해요. 전력 76 미만 구단은 모두 승격해요.</li>
        <li>은퇴하면 커리어 카드에 숨겨져 있던 재능 등급과 성장 곡선이 공개돼요.</li></ul>
      <h2>역할 숙련도와 감독 지시</h2><ul>
        <li><b>형성기</b>: 21세까지는 역할을 직접 골라요. 22세부터는 감독이 정하고, 시즌마다 한 번 다른 역할을 요청할 수 있어요.</li>
        <li><b>숙련도</b>(0~100): 한 시즌 뛸 때마다 26 × 나이 계수(19세 이하 1.35 · 23세 이하 1.0 · 28세 이하 0.72 · 그 위 0.52) × (0.45 + 0.55 × 출전 비율)만큼 쌓여요. 25 이상이면 <b>익숙함</b>, 60 이상이면 <b>주특기</b>.</li>
        <li>비슷한 역할(능력치 가중치 코사인 유사도 0.6 초과)은 일부가 같이 쌓이지만 45를 넘지 않아요.</li>
        <li><b>주특기 개수 한도</b>: 평범한 유망주 1 · 기대주 2 · 원더키드 3, 두뇌 능력치(시야·침투·수비 지능, 골키퍼는 위치선정·핸들링) 평균이 72 이상이면 +1. 한도를 넘는 역할은 59에서 멈춰요.</li>
        <li><b>낯선 역할의 대가</b>(숙련도 60 미만일 때 비율만큼): 공격 포인트 최대 −18%, 평점 최대 −0.3, 출전 확률 로지스틱 −0.5.</li>
        <li><b>감독이 고르는 기준</b>: 스타일 궁합 × 1.2 + (역할 적성 − 오버롤) ÷ 3.5 + 숙련도 비율 × 1.1 + 지난 시즌 역할 보너스(같은 감독 1.2, 다른 감독 0.5) + 약간의 변수.</li>
        <li><b>요청 성공 확률</b>: 0.3 + (신뢰 − 50) ÷ 90 + 명성 ÷ 220 + 궁합 × 0.16 + 숙련도 비율 × 0.18 + 주장 0.08 − 새 구단 0.1 (5~88%). 실패하면 감독 신뢰 −3.</li>
        <li><b>포지션 전향</b>: 인접 포지션의 역할 중 (그 포지션 오버롤 + 역할 적성) ÷ 2가 지금보다 1.6 이상(29세부터는 0.8) 높으면 감독이 제안해요. 30대에는 신체 능력치가 빨리 떨어지고 두뇌 능력치가 버티기 때문에 두뇌형 역할 쪽으로 제안이 기울어요. 전향 직후 그 역할 숙련도는 18에서 시작해요. 전향 후 2시즌 안에 평점 7.0 이상이면 ‘재발견’ 사건이 일어나요.</li>
        <li><b>부상 뒤의 선택</b>: 장기 부상(십자인대·아킬레스건 파열이나 20주 이상)을 당한 다음 여름, 인접 포지션에 지금 몸에 더 맞는 역할이 있으면(+0.3 이상) 감독이 전향을 제안해요. 이때 전향하면 재발견에 나이 제한이 없어요. 장기 부상 다음 시즌 18경기 이상·평점 7.05 이상이면 ‘돌아왔다’ 사건과 기사가 나와요.</li></ul>
      <h2>개인상</h2><ul>
        <li>개인상은 정해진 기준점이 아니라 그 리그·그 해의 <b>경쟁자</b>와 겨뤄요. 리그 상위 6개 구단마다 포지션별 주전급(공격수 2 · 윙어 2 · 공격형 미드 1 · 중앙 미드 2 · 수비형 미드 1 · 수비수 4 · 골키퍼 1 · 21세 이하 2)을 구단 전력 −1, 표준편차 2.8로 굴리고, 내 시즌과 같은 공식으로 골·도움·평점을 계산해요. 같은 세계선이면 늘 같은 경쟁자예요.</li>
        <li><b>득점왕·도움왕</b>: 리그 골(전체 골 × 리그 출전 비율)이 경쟁자 최다 기록보다 많으면 수상, 같으면 반반. 10%의 해엔 누군가 괴물 시즌(+15~30%)을 보내요. 최소 8골·6도움. 아깝게 놓치면 시즌 결과에 차이가 표시돼요.</li>
        <li><b>리그 MVP</b>: 시즌 평점이 경쟁자 최고 평점 + 0.04를 넘고 팀이 4위 이내(또는 리그 공격포인트가 득점왕 기록 이상). 수비수는 0.08, 골키퍼는 0.3 더 높아야 해요.</li>
        <li><b>최우수 수비수</b>(수비수·수비형 미드)·<b>최우수 골키퍼</b>: 그 포지션 경쟁자 최고 평점 초과, 팀 6위 이내. <b>영플레이어</b>: 21세 이하 경쟁자 최고 평점 초과. <b>베스트 11</b>: 22경기 이상에 공격 3번째 · 미드 3번째 · 수비 4번째 · 골키퍼 1번째 평점 초과.</li>
        <li>평점 비교엔 ±0.04 정도 흔들림이 있어요.</li></ul>
      <h2>현지 언론</h2><ul>
        <li>모든 매체는 가상의 신문이에요. 1군 시즌이 끝나면 구단 리그의 매체가 평점과 한 줄 평을 실어요. 해외에서 뛰는 한국·일본 선수는 자국 매체 평도 같이 실려요. 레알 마드리드·바르셀로나 선수는 두 도시 신문의 평가를 같이 받아요.</li>
        <li>평점 방식: 잉글랜드·스코틀랜드 10점 만점 정수 · 이탈리아 파젤라(6이 보통, 0.5 단위, 거의 안 뛰면 s.v.) · 독일 노트(1.0이 최고, 6.0이 최저) · 프랑스 10점 만점이지만 짜게(같은 활약이면 1.5점 낮게) · 스페인 별 0~3개(연고 구단엔 후하고 라이벌엔 짜게) · 나머지 10점 만점 소수점.</li>
        <li>평가 등급: 시즌 평점 7.55 이상이거나 득점왕·리그 MVP·발롱도르면 최고, 7.2 · 6.92 · 6.62 순으로 내려가요. 출전 비율 30% 미만에 15경기 미만이면 ‘벤치’, 22주 이상 부상에 18경기 미만이면 ‘부상’ 평이 실려요.</li>
        <li>헤드라인은 이적(라이벌 이적은 따로), 리그·컵·챔스 우승과 결승 패배, 득점왕, 승부차기 실축, 장기 부상, 주장 선임, 태업, 포지션 전향과 재발견, 대표팀 대회·소집 거부·대표팀 은퇴와 복귀·황금세대, 등번호 요구, 결승 징크스, 병역, 발롱도르, 은퇴와 영구결번·명예의 전당 때 실려요. 기록 → 신문에 모여요.</li></ul>
      <h2>대표팀</h2><ul>
        <li><b>소집 기준</b>: OVR이 (대표팀 전력 − 4)를 넘으면 뽑혀요. 21세 미만은 +3, 명성 40마다 −1, 최저 58. 소집된 시즌엔 친선전과 예선으로 A매치 4~8경기를 뛰어요.</li>
        <li><b>대회 주기</b>(여름 연도 기준): 월드컵 4년마다(2026, 2030…), 유로·코파 아메리카·OFC 네이션스컵 4년마다(2028, 2032…), 아시안컵 4년마다(2027, 2031…), 아프리카 네이션스컵·골드컵 2년마다(홀수 해). 올림픽은 2028, 2032…, 아시안게임은 2026, 2030…(AFC 국가만, 호주 제외).</li>
        <li><b>본선 진출</b>: 팀 전력 = 대표팀 전력 + (내 OVR − 대표팀 전력) × 0.25 + 대표팀 주장(0.6 + 주장 1년마다 0.25, 최대 2) + 황금세대. 대회·대륙마다 기준선이 있고(월드컵 UEFA 73 · CONMEBOL 71 · CAF 70 · AFC 63 · CONCACAF 61 · OFC 56, 유로 66, 아시안컵 50, 네이션스컵 56, 골드컵 50, 올림픽 UEFA 80 · CONMEBOL 79 · CAF 73 · CONCACAF 71 · AFC 70), 기준선과의 차이로 진출 확률이 정해져요. 개최국은 자동 진출이고 전력 +2.5. 같은 세계선에서는 나라·연도별 예선 결과가 고정돼요.</li>
        <li><b>예선 탈락</b>: 성격에 따라 반응이 달라요. 프로페셔널은 덤덤(0), 충성파 −1, 쇼맨 −2, 리더 −3, 야망가 −5, 기분파는 반반 확률로 −6 또는 +2. 대표팀 전력 70 미만처럼 원래 기대가 크지 않던 나라면 하락폭이 절반, 31세 이상이면 프로페셔널이 아닌 한 −2가 더해져요. 남은 여름은 푹 쉬기(몸 +5) · 프리시즌 조기 합류(신뢰 +4, 팬심 +2) · 개인 훈련 캠프(다음 시즌 성장 ×1.04) 중에 골라요.</li>
        <li><b>올림픽·아시안게임</b>은 그해 23세 이하만 나가요(OVR 기준선은 대표팀 전력 − 16). 24~32세 중 OVR이 대표팀 전력 − 1 이상이면 와일드카드로 부를 수 있어요(병역 미필 한국 선수는 올림픽 75%, 아시안게임 85%, 그 외 8%·5%). 의무 차출이 아니라서 해외 빅클럽은 30~45% 확률로 보내주지 않아요. 대회가 겹치면 하나만 골라요.</li>
        <li><b>황금세대</b>: 나라마다 8년 단위로 16% 확률로 찾아와 4~6년 동안 대표팀 전력 +2.5~5. 시작될 때 사건과 기사가 나와요.</li>
        <li><b>경기 운영은 상황을 탄다</b>. 경기 전 카드에 상대와의 전력 차(2.5 이상이면 한 수 위·아래)와 팀 안에서 내 비중(내 OVR이 대표팀 전력보다 8 이상이면 절대적 에이스, 3 이상이면 핵심)이 나와요. 전반·후반을 따로 계산해요.
          <ul><li>‘내가 해결한다’: 팀 득점 ×1.13(절대적 에이스) · ×1.05(핵심) · ×0.99(그 외), 실점 ×1.04~1.06(우세할 땐 ×1.02 더). 후반을 뒤진 채 시작하면 득점 ×1.35 · 실점 ×1.08. 내 골 비중 ×1.5 · 도움 ×0.9, 평점 기복 ×1.3.</li>
          <li>‘팀을 위해 뛴다’: 비슷한 상대면 득점 ×0.94 · 실점 ×0.9, 한 수 위 상대면 ×0.95 · ×0.8, 우세하면 ×0.88 · ×0.95. 후반에 앞서 있으면 실점 ×0.8 더, 뒤지면 득점 ×0.88. 내 골 ×0.6 · 도움 ×1.2.</li>
          <li>‘평소대로’: 우세하면 득점 ×1.03, 후반에 뒤지면 득점 ×1.08 · 실점 ×1.04.</li></ul></li>
        <li>조별리그는 1·2위가 올라가고, 48개국 월드컵·유로·네이션스컵·아시안컵·아시안게임은 승점 4점 이상 3위(3점이면 득실 0 이상 시 60%)도 올라가요.</li>
        <li><b>대표팀 갈등</b>: 소집 고사(그 시즌 A매치 절반, 감독 신뢰 +3, 명성 −1) · 공개 거부(그 시즌 대표팀 제외, 명성 −3, 자국 기사). 전력 80 이상 구단에선 구단이 차출을 막는 사건(따르면 A매치 절반, 맞서면 신뢰 −8에 25%로 출전 시간 보복). 26~31세·A매치 12경기 이상이면 이른 대표팀 은퇴 고민, 32세 이상·30경기 이상이면 대표팀 은퇴 고민이 와요. 대표팀에서 은퇴했어도 월드컵 1년 전, 35세 이하에 OVR이 대표팀 전력 −2 이상이면 복귀 요청이 올 수 있어요.</li>
        <li><b>연장과 승부차기</b>: 무승부면 38% 확률로 연장에서 결판나요. 승부차기 키커 순서는 공격수 1번, 미드필더 3번, 수비수 5번. 구석으로 차면 골키퍼가 방향을 읽어도 30%(결정력·드리블에 따라 15~50%) 들어가고, 못 읽으면 92% 안팎. 가운데는 골키퍼가 버티면 12%, 아니면 97%. 골키퍼는 첫 키커 방향을 맞히면 62% 선방.</li>
        <li>대표팀 경기에서도 수비수·수비형 미드는 태클·가로채기, 골키퍼는 선방이 기록돼요.</li>
        <li><b>대회 개인상</b>: 4경기 이상 평균 평점 7.5 이상으로 4강 이상이면 75% 확률로 골든볼. 월드컵·유로 5골(40% 확률로 6골 필요), 그 외 4골(5골)이면 득점왕.</li>
        <li><b>병역(대한민국)</b>: 아시안게임 금메달이나 올림픽 메달이면 병역 혜택. 혜택이 없으면 27세에 입영 통지가 오고 1년 미룰 수 있어요. 28세엔 반드시 입대해 김천 상무에서 한 시즌(성장 ×0.85)을 보내고 원 소속팀으로 돌아가요.</li>
        <li><b>발롱도르</b>는 여름 대회가 끝난 뒤 계산해요. 월드컵 우승 +13 · 준우승 +6 · 4강 +3 · 조별리그 탈락 −2, 대륙 대회 우승 +6 · 준우승 +3, 대회 골당 +0.5, 골든볼 +2.5.</li></ul>
      <h2>이적과 계약</h2><ul><li>전력 84 이상 빅클럽은 OVR 83부터 관심을 보여요.</li>
        <li><b>이적료</b>(€M) = 3 × e^((OVR − 70) ÷ 5.5) × 나이(21세 이하 1.35 · 24세 이하 1.25 · 27세 이하 1.05 · 29세 이하 0.8 · 31세 이하 0.5 · 그 위 0.28) × 남은 계약(3년 이상 1 · 2년 0.85 · 1년 0.55) × (1 + 명성 ÷ 220). 계약이 끝났으면 0.</li>
        <li><b>구단 예산</b> = 8 × e^((구단 전력 − 70) ÷ 6) × 리그 자금력 × 0.8~1.25(해마다 다름). 자금력: 잉글랜드 1.6 · 사우디 1.5 · 스페인 1.0 · 독일 0.95 · 이탈리아 0.85 · 프랑스 0.75 · MLS·튀르키예 0.5 · 챔피언십 0.45 · 포르투갈·네덜란드 0.42 · 벨기에·브라질 0.34 · 스코틀랜드 0.28 · 그리스·2. 분데스리가 0.25 · J리그 0.2 · 나머지 2부·아르헨티나 0.14~0.18 · K리그 0.14. 파리 생제르맹 2.1, 뉴캐슬 1.3, 레알 마드리드 1.3, 첼시·바이에른 1.2, 맨시티 1.15, 바르셀로나 0.85. 이적료가 예산보다 크면 제안 확률 × (예산 ÷ 이적료)^1.6.</li>
        <li><b>영입 정책</b>: 아틀레틱 빌바오는 스페인 국적만 영입하고(바스크 혈통이어야 해서 ×0.35, 빌바오 유스 출신은 ×1.2), 사우디는 29세 이상·OVR 79 이상 외국인 스타를 ×1.7로 선호하고 25세 미만은 ×0.3, 브라질·아르헨티나는 외국인 ×0.25(남미 국적 ×0.7), K리그·J리그는 외국인 슬롯이 좁아 ×0.4(아시아 국적 ×0.6), MLS는 30세 이상 스타 ×1.3.</li>
        <li><b>포지션 수요</b>: 구단·연도·포지션마다 0.35~1.6배로 정해져 있어요.</li>
        <li><b>떠난 구단</b>: 이적으로 떠난 구단은 3시즌 동안 다시 제안하지 않아요. ‘친정의 러브콜’ 사건만 예외(떠난 지 2시즌 이후).</li>
        <li><b>제안 카드의 전망</b>: 그 구단 감독이 맡길 역할과 숙련도(21세까지는 직접 골라요), 예상 출전(지금 능력, 새 구단이면 감독 신뢰 48에서 시작, 역할 궁합과 숙련도), 리그 판도(구단 전력에 내 영향력을 더한 순위: 우승 후보 1순위 · 우승 경쟁 · 상위권 · 중위권 · 하위권), 그리고 이 세계선이 기억하는 그 해의 리그 우승팀과 그 구단에 있는 선배가 나와요.</li></ul>
      <h2>연봉과 계약 조건</h2><ul>
        <li>돈은 모두 원화로 보여요. 이적료는 유로로 계산해서 €1M = 15억 원으로 바꿔요.</li>
        <li><b>시장 연봉</b> = 리그 평균 연봉 × e^((OVR − (리그 평균 전력 − 1)) ÷ 8) × e^((구단 전력 − 리그 평균 전력) ÷ 25) × 나이(19세 이하 0.4 · 21세 이하 0.65 · 32세 이상 0.8, 사우디·MLS는 제외) × (1 + 명성 ÷ 250). 리그 평균(억 원): 사우디 55 · 잉글랜드 45 · 스페인 30 · 독일 28 · 이탈리아 25 · 프랑스 22 · 튀르키예 15 · 챔피언십 12 · 네덜란드 10 · 브라질 9 · 포르투갈·벨기에·MLS 8 · 그리스·2. 분데스리가 6 · 스코틀랜드 5 · 세군다 4 · 세리에 B·아르헨티나 3.5 · J리그·리그 2 3 · K리그 2.5. 파리 생제르맹 ×1.35, 인터 마이애미 ×1.4, 레알 마드리드 ×1.15, 맨시티·바이에른·맨유 ×1.1, 첼시·바르셀로나 ×1.05.</li>
        <li><b>제안 연봉</b> = 시장 연봉 × 예상 역할(핵심 주전 1.12 · 주전 경쟁 1 · 로테이션 0.9 · 백업 0.78) × 자유계약 1.12 × 0.9~1.15. 1군 첫 계약은 시장 연봉의 0.7배. 임대는 원 소속팀 연봉 그대로.</li>
        <li><b>요구는 제안마다 한 번</b>. 받아줄 확률 = 예상 역할(핵심 주전 60% · 주전 경쟁 45% · 로테이션 28% · 백업 12%) + 명성 ÷ 200 + 자유계약 8%에서,
          <ul><li>연봉 인상: −5%. 받아들이면 연봉 +20%, 거절되면 15% 확률로 제안 철회.</li>
          <li>바이아웃 조항: +2%(빅클럽 −12%). 금액은 내 이적 가치의 2.2배, 대신 연봉 −7%. 이 금액 이상 제안이 오면 구단이 이적을 막을 수 없어요.</li>
          <li>출전 보장: −2%(빅클럽 −18%). 첫 시즌 출전 확률이 크게 오르는 대신(로지스틱 +0.6) 감독 신뢰가 6 낮게 시작해요.</li></ul> 5~85%로 잘라요.</li>
        <li><b>재계약</b>(계약 1년 남았을 때): 구단 제시 연봉 = 시장 연봉 × (1 + (지난 시즌 평점 − 6.9) × 0.35, 0.85~1.25배). 2년 단기는 ×1.08. 더 달라고 하면 0.25 + (평점 − 6.9) × 0.5 + (출전 비율 − 0.6) × 0.4 + 명성 ÷ 250 확률(5~80%)로 4년 ×1.25, 거절되면 감독 신뢰 −4에 협상이 미뤄져요. 바이아웃 조항을 넣자고 하면 그 확률 +5%로 연봉 ×0.95에 조항 추가. 계약이 끝난 채 남으면 제시 연봉으로 2년 재계약.</li>
        <li>야망가·쇼맨은 시장 연봉의 70%도 못 받으면 시즌마다 사기 −4. 시즌마다 연봉이 커리어 총수입에 쌓여요(김천 상무는 0.25억). 은퇴 카드와 역대 기록에 남아요.</li><li>계약이 2년 이상 남은 핵심 선수는 구단이 이적을 막을 수 있어요. 이적 요청이나 태업으로 뚫을 수 있지만 대가가 커요.</li><li>계약이 끝나면 자유계약으로 더 많은 제안을 받아요.</li><li>수비 리더, 헌신형 윙어, 카릴레로, 앵커, 홀딩 풀백, 수비형 윙백, 프레싱 포워드는 시즌마다 감독 신뢰를 2~4 더 얻어요.</li><li>22세 이하이고 출전 비율이 낮으면 임대 제안이 와요.</li></ul>
      <h2>등번호</h2><ul>
        <li>1군 승격과 이적 때마다 번호를 골라요. 이적할 땐 다른 선수가 단 번호도 한 번 <b>요구</b>할 수 있어요. 받아들여질 확률 = 예상 역할(핵심 주전 55% · 주전 경쟁 32% · 로테이션 14% · 백업 5%) + 명성 ÷ 160 − 8%(11번 이하) 또는 +5%(12번 이상) + 8%(이적료 €40M 이상), 3~85%. 거절되면 사기 −2와 기사.</li>
        <li>재계약 때 선호 번호를 함께 요구할 수 있어요(같은 확률, 거절되면 사기 −3).</li>
        <li>명성 30 이상이거나, 스카우트 별 4개 이상에 출전 50% 이상인 21세 이하 유망주면 구단이 포지션의 상징 번호(공격수 9·10, 윙어 7·11, 공격형 미드 10, 중앙 8, 수비형 6, 센터백 4·5, 풀백·윙백 2·3, 골키퍼 1)를 권하는 사건이 생길 수 있어요. 구단마다 한 번.</li></ul>
      <h2>영구결번과 구단 명예의 전당</h2><ul>
        <li>구단이 클수록 문턱이 높아요. <b>빅클럽</b>(전력 84+): 그 구단에서 12시즌 이상(유스·임대 제외) · 팬심 92 이상 · 주요 트로피(리그·챔스·대륙컵·유럽 대항전) 2개 이상 · 그리고 주장 3시즌 이상이나 발롱도르나 피크 89 이상이나 15시즌 이상. <b>중견</b>(77~83): 9시즌 · 팬심 88. <b>작은 구단</b>: 7시즌 · 팬심 84.</li>
        <li>조건을 채우면 결번 확률 = 빅 10% · 중견 20% · 작은 구단 28% + 넘친 시즌마다 3% + 주장 6% + 충성파 6% + 발롱도르마다 10% + 15시즌 이상 10% + 원클럽맨 10% (최대 85%).</li>
        <li><b>구단 명예의 전당</b>: 결번까지는 아니어도 빅클럽 7시즌·팬심 78, 중견 6시즌·74, 작은 구단 5시즌·70 이상이거나, 4시즌 이상에 주요 트로피 3개·팬심 65 이상이면 헌액돼요.</li>
        <li>결번된 번호는 이후 커리어에서 쓸 수 없지만, 같은 가문 후손에게는 구단이 다시 열어 주기도 해요.</li></ul>
      <h2>은퇴</h2><ul>
        <li>32세부터는 시즌 준비 화면에 ‘은퇴 선언’이 있어요. 그 전에도 1군에 올라온 뒤라면 ‘커리어 결정’ 칸에서 언제든 조기 은퇴할 수 있어요.</li>
        <li>31세 이하에 은퇴하면 이유를 골라요(부상 후유증 · 번아웃 · 가족 · 다른 꿈 · 이유 없이 조용히). 이유에 따라 은퇴 기사와 커리어 카드 문구가 달라지고, 숨겨진 잠재력이 피크 OVR보다 5 이상 높았다면 카드에 ‘못다 핀 재능’이 붙어요. 감독의 길은 나이와 상관없이 고를 수 있어요.</li>
        <li>은퇴 카드엔 <b>최고의 시즌</b>(평점·공격 포인트·트로피·개인상으로 고른 한 시즌), <b>최고의 폼</b>(연속 3시즌 평균 평점이 가장 높은 구간), <b>커리어 정점</b>(가장 높았던 OVR)이 따로 나와요. 후손이면 <b>아버지와 다른 길</b>(포지션·대표 구단·라이벌 구단·성장 곡선·기질·피크·발롱도르 가운데 두드러진 둘)이 붙어요.</li>
        <li><b>대표팀 은퇴</b>도 ‘커리어 결정’ 칸에서 언제든(32세 미만이면 이른 은퇴 기사). 은퇴 중엔 시즌마다 한 번 복귀 의사를 밝힐 수 있고, 감독이 받아줄 확률 = 로지스틱((OVR − 소집 기준) ÷ 2.5) × 0.6(34세 이상) × 0.7(은퇴 1년 이내) − 10%(소집 거부 이력), 3~90%. 거절되면 사기 −1.</li></ul>
      <h2>결승</h2><ul>
        <li><b>챔스·리베르타도레스·ACL 결승</b>은 시즌이 끝난 뒤 직접 치러요. 우리 팀 전력은 그 시즌 구단 전력 + 내 영향력(리그 계산과 같음), 경기 계산은 대표팀 토너먼트와 같아요(운영 방식 · 전반·후반 · 연장 38% · 승부차기). 출전은 그 시즌 출전 비율(부상 반영)이 50% 이상이면 97%, 25% 이상 60%, 10% 넘으면 30%, 그 아래면 명단 밖이에요. 결승 결과가 나온 뒤에 트로피·기사·연출·발롱도르 점수가 반영돼요. 결승 도중 앱을 닫으면 다시 열 때 ‘평소대로’로 자동 처리돼요. 다른 컵 결승은 자동이에요.</li>
        <li><b>결승 평점의 기준선</b>은 그 선수의 그 시즌 기준선이에요(실력·역할 적성·팀 전력·감독 궁합·숙련도·사기, 시즌 평점과 같은 공식에 순위 보너스까지). 여기에 기대만큼의 공격 포인트를 깔고, 팀이 넣은 골 가운데 기대보다 더 넣으면 골당 +0.7, 도움 +0.45, 팀이 '이길 확률보다' 잘 됐는지 ±0.45 × (결과 − 이길 확률), 수비수·수비형 미드는 무실점 +0.3 · 실점마다 −0.12 · 태클·가로채기, 골키퍼는 무실점 +0.45 · 선방, 그리고 경기 변수가 붙어요. 그래서 약팀 선수라고 결승에서 유독 잘 나오지 않고, 강팀 선수라고 유독 못 나오지 않아요. 평점 8.2 이상이면 MOTM.</li>
        <li>클럽 결승 승부차기에선 공격수 90% · 미드 70% · 수비수 40% 확률로 키커로 나서고, 기본 성공률은 76%(결정력 반영)예요.</li>
        <li><b>결승 징크스</b>: 결승에서 3번 연속 지면 꼬리표가 붙고(주요 트로피가 하나도 없으면 ‘무관의 제왕’), 다음 결승을 이기면 깨져요. 징크스 중엔 기자회견 사건이 생길 수 있어요.</li></ul>
      <h2>숨은 기질</h2><ul>
        <li>선수마다 숨은 축이 둘 있어요. <b>큰 경기 멘탈</b>과 <b>대표팀 궁합</b>. 만들 때 몰래 정해지고(평균 0, 표준편차 0.55·0.5, 리더 +0.15 · 야망가·쇼맨 +0.1 · 프로페셔널 +0.05, 충성파는 대표팀 궁합 +0.1, 후손은 부모 값 30%), 은퇴할 때 커리어 카드에 이름과 근거가 공개돼요.</li>
        <li><b>효과</b>(양 끝 기준, 중간은 비례): 결승 평점 ±0.3 · 결승 공격 포인트 ±12% · 승부차기 성공률 ±12%p(골키퍼 선방 ±10%p) · 팀의 결승 승률 ±2.5%p(직접 치르는 결승에선 팀 득점·실점 ±4%). 대표팀 토너먼트에선 8강 ¼ · 4강 ½ · 결승 전부가 적용돼요. 대표팀 궁합은 대표팀 경기 평점 ±0.25 · 골 ±15% · 팀 득점 ±3% · 친선전 골 ±15%. 기분파는 큰 경기 평점이 1.5배로 출렁이고, 프로페셔널은 0.85배.</li>
        <li><b>변화</b>: 결승에 오른 것 자체는 기질을 움직이지 않아요. 결승(대표팀은 4강·8강도)에서 <b>기대보다</b> 잘하거나 못한 만큼만 움직여요. 결정적 장면 +0.09 × (1 − 그 장면이 나올 기대 확률), 무너진 경기 −0.08 × (1 − 기대 확률), 기대 평점보다 0.6 이상 높거나 낮으면 ±0.03(4강은 0.6배, 8강은 0.35배). 승부차기 성공 +0.05 · 실축 −0.12 · 키퍼 선방 +0.06 · 결승 3연패 −0.05 · 징크스 탈출 +0.15. 대표팀 궁합은 대회 평균 평점이 같은 시즌 클럽 평점보다 0.35 이상 높으면 +0.07, 낮으면 −0.07(3경기 이상), 우승 +0.03, 소집 고사 −0.08 · 공개 거부 −0.25 등. 크기는 매번 0.5~1.5배로 흔들리고, 12%는 거꾸로 가요. 정해진 공략법은 없어요.</li>
        <li><b>멘탈 코치</b>(사건): 30% 확률로 한 단계(+0.5) 좋아지고, 10%는 역효과(−0.3), 나머지는 변화 없음. 혼자 이겨내기를 고르면 15% +0.3 · 10% −0.15. 결과는 알려주지 않아요.</li>
        <li><b>힌트</b>: 결승에서 기질이 뚜렷하게 드러나면 40% 확률로 기사가 나고, 가끔 동료 인터뷰가 실려요(동료 말은 25% 확률로 엉뚱해요).</li>
        <li><b>큰 경기 기록</b>: 결승은 1, 대표팀 4강 0.6, 8강 0.35의 비중으로 ‘그 시즌 자기 평점’과 비교해요(대표팀은 그 여름 직전 시즌). <b>결정적 장면</b>은 이긴 경기의 결승골(점수 차 안의 골, 승부차기로 이겼다면 득점만으로도) · 자기 평점보다 1.0 이상 높은 MOTM · 이긴 승부차기의 성공(키퍼는 선방). <b>무너진 경기</b>는 진 경기에서 자기 평점보다 1.0 이상 낮거나 승부차기 실축, 또는 결과와 상관없이 1.4 이상 낮을 때예요.</li>
        <li><b>이름 붙이는 법</b>: 점수 = 숨은 값 × 0.5(큰 경기가 적으면 비중을 줄여요) + (큰 경기 평점 − 시즌 평점, 표본이 적을수록 0 쪽으로) × 0.5 + 승부차기. <b>칠전팔기</b> 무너진 경기가 먼저 2번 이상 쌓이고 마지막 장면이 결정적 장면이거나, 결승 징크스를 깼을 때 · <b>풍운아</b> 결정적 장면과 무너진 경기가 2번 이상씩 · <b>승부사</b> 결정적 장면이 2번 이상이고 기대치(이길 확률 × 포지션별 결정적 장면 확률)보다 많을 때. 강팀이라 결승을 많이 이긴 것만으론 안 돼요 · <b>강심장</b> 큰 경기 3번 이상, 무너진 경기·실축 없이 시즌 평점 이상을 유지 · <b>새가슴</b> 큰 경기가 충분한데 점수 −0.42 이하, 또는 결정적 장면 없이 무너진 경기 2번 · <b>국밥</b> 그 밖.</li>
        <li><b>대표팀</b>: ‘얼마나 잘했나’(대회 평균 평점)와 ‘얼마나 더 잘했나’(같은 시즌 클럽 평점 대비)를 나눠요. 대표팀 경기 평점은 그 시즌 클럽 폼에서 출발하기 때문에, 클럽에서 잘한 선수가 대표팀에서도 그만큼 하면 차이가 0이에요. 점수 = 숨은 값(대회 경기 수가 적으면 비중을 줄여요) + (대회 평점 − 클럽 평점) × 경기 수 ÷ (경기 수 + 8) + A매치 득점이 기대보다 많거나 적은 만큼(친선전 기대 득점은 대회 경기의 0.55배). <b>애국자</b> 0.45 이상 · A매치 15경기+, <b>클럽 여포</b> −0.45 이하 · 10경기+ (대회 4경기 미만이면 기준이 0.15 높아요). 양쪽에서 모두 잘한 선수는 이름이 붙지 않아요.</li>
        <li>근거 문장은 선수마다 조금씩 다르게 나오고, 클럽 결승은 시즌 표기(2039/40), 대표팀은 여름 연도로 적어요.</li></ul>
      <h2>세계선</h2><ul>
        <li>은퇴한 커리어의 기록(리그·대륙 대회·대표팀 우승, 발롱도르, 득점왕·리그 MVP, 시즌 성적)은 그 세계선의 <b>역사</b>가 돼요. 새 커리어는 세계선과 시작 연도를 골라서 시작해요.</li>
        <li><b>역사의 관성</b>: 기록된 결과가 있는 해에 뛰면 역사가 버텨요. 기록된 리그 우승팀은 다른 구단에겐 지지 않고, 내 팀만 전력 차 2.2를 넘어서야 뒤집을 수 있어요. 대륙 대회 우승팀은 2.4(내 팀이 아닌 상대에겐 지지 않아요), 대표팀 대회 우승국은 2.2(4강·결승에서 만날 가능성이 커요), 발롱도르는 기록된 수상자보다 3점, 득점왕은 기록보다 1골 더 필요해요. 기록상 내 팀이 우승한 해엔 거꾸로 내 팀이 2.2를 얻어요. 같은 해 같은 구단에 있던 선배의 기록에 우승이 없으면 그 우승도 쉽게 오지 않아요(−2.2).</li>
        <li><b>분기</b>: 기록된 결과를 뒤집으면 그 시즌에서 세계선이 갈라지고 짧은 연출이 나와요. 새 세계선은 갈라지기 전까지의 역사를 원래 세계선과 함께 쓰고, 그 뒤로는 따로 흘러요. 원래 세계선은 그대로 남아요. 한 시즌에 한 번만 갈라져요.</li>
        <li><b>선배의 재등장</b>: 이전 주인공들은 이 세계선에 그대로 살아 있어요. 같은 해 같은 구단이면 동료로(만나는 사건이 있어요), 결승 상대 구단이나 상대 대표팀에 있으면 상대로, 같은 리그에서 뛰었으면 득점왕 경쟁자로 이름이 나오고, 은퇴 뒤엔 감독으로 벤치에 앉아요. 갈라진 뒤에도 그 사람의 길(소속 구단·감독 경력)은 이어지지만 결과는 정해져 있지 않아요. 갈라진 뒤에 데뷔한 선수는 그 세계선에 없어요.</li>
        <li><b>영구결번·명예의 전당</b>은 그 일이 일어난 다음 시즌부터, 그 세계선에서만 적용돼요.</li>
        <li><b>세계선 계보</b>에서 갈래들이 언제, 누가, 무엇을 바꿔 갈라졌는지 볼 수 있어요. 옛 세이브의 겹친 커리어는 은퇴한 순서대로 넣으면서 처음 어긋나는 해에서 갈랐어요.</li>
        <li><b>구단 연대기</b>: 주인공이 뛴 해는 그 기록, 나머지 해는 세계의 기본 흐름으로 순위를 잡아요. 3시즌 안에 2위 이내가 두 번 이상이고 우승이 있으면 황금기, 하위 40%가 3시즌 넘게 이어지면 몰락(그 전 5년 안에 4위 안이 있었으면)·긴 침체, 그 뒤 다시 4위 안이면 재건. 6시즌 넘게 뛴 주인공의 시대, 3년 넘게 떠났다 돌아온 귀환, 4시즌 이상 뛴 구단을 감독으로 맡은 전설, 결번과 명예의 전당도 같이 적혀요.</li></ul>
      <h2>일기</h2><p>시즌을 시작하기 전에 일기를 쓸 수 있어요. ‘오늘의 질문’을 받으면 질문과 함께 남아요. 기록 → 일기에서 모아 볼 수 있어요.</p>
      <h2>계승</h2><ul><li>커리어 중 태어난 아이로 후손 커리어를 시작할 수 있어요. 잠재력 일부, 외모, 가문 클럽이 이어져요.</li><li>감독이 된 선수는 은퇴 2~4년 뒤부터 66세 무렵까지 여러 구단을 맡아요.</li><li>한 해의 발롱도르는 세계선에 한 명뿐이에요.</li><li>후손이 아버지와 다른 포지션군으로 자리 잡거나(22세 이후), 아버지의 대표 구단이나 그 라이벌 구단에 처음 들어가면 사건과 기사가 나와요.</li></ul>
    </section>`;
  }

    $$('[data-wtab]').forEach(b => b.onclick = () => { S.worldTab = b.dataset.wtab; render(); });
